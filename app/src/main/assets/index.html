<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Tally — Habit Tracker</title>
<meta name="description" content="A quiet ledger for the things you do daily." />
<meta name="theme-color" content="#0F1115" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tally" />

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0F1115;
    --surface: #161A21;
    --surface2: #1C222C;
    --border: #2A3140;
    --text: #F0EDE6;
    --muted: #8B92A0;
    --faint: #5A6270;
    --accent: #06D6A0;
    --radius: 14px;
    --radius-sm: 10px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  #root { min-height: 100%; }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }
  input {
    font-family: inherit;
    color: inherit;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes barGrow {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 var(--glow); }
    50% { box-shadow: 0 0 12px 2px var(--glow); }
  }
  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  .fade-up { animation: fadeUp 0.45s var(--ease) both; }
  .scale-in { animation: scaleIn 0.35s var(--ease) both; }

  .tap {
    transition: transform 0.18s var(--ease), filter 0.18s var(--ease), background 0.18s, border-color 0.18s;
  }
  .tap:active { transform: scale(0.96); }
  .tap:hover { filter: brightness(1.08); }

  .progress-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.7s var(--ease);
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: shimmer 2.2s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .day-glow {
    --glow: color-mix(in srgb, var(--habit-color) 55%, transparent);
    animation: pulseGlow 2.6s ease-in-out infinite;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
  }
  .chart-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .chart-dot {
    transition: r 0.25s var(--ease), opacity 0.25s;
  }
  .chart-dot:hover { r: 5; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const CATEGORY_COLORS = [
  { name: "Mint", hex: "#06D6A0" },
  { name: "Coral", hex: "#FF6B6B" },
  { name: "Amber", hex: "#F2A93B" },
  { name: "Sky", hex: "#4D96FF" },
  { name: "Violet", hex: "#9B72CF" },
  { name: "Rose", hex: "#EF476F" },
  { name: "Lime", hex: "#A9D82D" },
  { name: "Sunflower", hex: "#FFD166" },
];

const DATA_KEY = "tally-data-v1";
const THEME_KEY = "tally-theme-v1";

function pad(n){ return String(n).padStart(2,"0"); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return dateKey(new Date()); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function sameDay(a,b){ return dateKey(a)===dateKey(b); }
function startOfWeek(d){ const r=new Date(d); r.setDate(r.getDate()-r.getDay()); r.setHours(0,0,0,0); return r; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function startOfYear(d){ return new Date(d.getFullYear(), 0, 1); }
function monthLabel(d){ return d.toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function goalMet(value, goal){ if(value==null) return false; return goal>0 ? value>=goal : value>0; }

function buildMonthGrid(viewDate){
  const year=viewDate.getFullYear(), month=viewDate.getMonth();
  const first=new Date(year,month,1);
  const startOffset=first.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,month,d));
  while(cells.length%7!==0) cells.push(null);
  return cells;
}

function longestStreakEver(entries, goal){
  const keys = Object.keys(entries);
  if(!keys.length) return 0;
  const dates = keys.map(parseKey).sort((a,b)=>a-b);
  let cursor = new Date(dates[0]);
  const end = new Date();
  let longest=0, current=0;
  while(cursor<=end){
    const k = dateKey(cursor);
    if(goalMet(entries[k], goal)){ current+=1; longest=Math.max(longest,current); } else { current=0; }
    cursor = addDays(cursor,1);
  }
  return longest;
}

function computeStreak(entries, goal){
  let streak=0, cursor=new Date();
  if(!goalMet(entries[dateKey(cursor)], goal)) cursor=addDays(cursor,-1);
  while(goalMet(entries[dateKey(cursor)], goal)){ streak+=1; cursor=addDays(cursor,-1); }
  return streak;
}

function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { habits: [], entries: {} };
}
function saveData(habits, entries){
  try{ localStorage.setItem(DATA_KEY, JSON.stringify({habits, entries})); return true; }
  catch(e){ return false; }
}

function Icon({ name, size=16, color="currentColor", strokeWidth=2 }){
  const p = { width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:color, strokeWidth, strokeLinecap:"round", strokeLinejoin:"round" };
  switch(name){
    case "plus": return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case "minus": return <svg {...p}><path d="M5 12h14"/></svg>;
    case "x": return <svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case "check": return <svg {...p}><path d="M20 6 9 17l-5-5"/></svg>;
    case "chevron-left": return <svg {...p}><path d="M15 18l-6-6 6-6"/></svg>;
    case "chevron-right": return <svg {...p}><path d="M9 18l6-6-6-6"/></svg>;
    case "chevron-down": return <svg {...p}><path d="M6 9l6 6 6-6"/></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>;
    case "flame": return <svg {...p}><path d="M12 2.5c1.2 3.4-3 4.8-3 8.3a3 3 0 006 0c0-1.2-.5-2-1.3-2.8.9 2.3-1 3.2-1 3.2 0-2.4 1.6-4.4 0-8.7z"/><path d="M8.5 12.5A4.5 4.5 0 0012 19a4.5 4.5 0 004.2-6.1"/></svg>;
    case "calendar": return <svg {...p}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>;
    case "bar-chart": return <svg {...p}><path d="M4 20V11M10 20V4M16 20v-6"/><path d="M2 20h20"/></svg>;
    case "line-chart": return <svg {...p}><path d="M3 3v18h18"/><path d="M6 16l4-5 4 3 5-7"/></svg>;
    case "target": return <svg {...p}><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5" fill={color}/></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>;
    case "upload": return <svg {...p}><path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "moon": return <svg {...p}><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>;
    case "edit": return <svg {...p}><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    case "more": return <svg {...p}><circle cx="12" cy="12" r="1.5" fill={color}/><circle cx="6" cy="12" r="1.5" fill={color}/><circle cx="18" cy="12" r="1.5" fill={color}/></svg>;
    default: return null;
  }
}

function getPeriodKey(d, period) {
  if (period === "day") return dateKey(d);
  if (period === "week") return dateKey(startOfWeek(d));
  if (period === "month") return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  if (period === "year") return `${d.getFullYear()}`;
  return dateKey(d);
}

function formatPeriodLabel(key, period) {
  if (period === "day") return parseKey(key).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  if (period === "week") {
    const d = parseKey(key);
    return `W${Math.ceil((d.getDate() + startOfWeek(d).getDay()) / 7)} ${d.toLocaleDateString(undefined,{month:"short"})}`;
  }
  if (period === "month") {
    const [y, m] = key.split("-");
    return new Date(+y, +m-1, 1).toLocaleDateString(undefined, { month: "short", year: "2-digit" });
  }
  return key;
}

function buildSeries(entries, period, count) {
  const now = new Date();
  const buckets = new Map();
  const keys = [];
  let cursor = new Date(now);
  for (let i = 0; i < count; i++) {
    const k = getPeriodKey(cursor, period);
    if (!keys.includes(k)) keys.unshift(k);
    if (period === "day") cursor = addDays(cursor, -1);
    else if (period === "week") cursor = addDays(cursor, -7);
    else if (period === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth()-1, 1);
    else if (period === "year") cursor = new Date(cursor.getFullYear()-1, 0, 1);
  }
  Object.entries(entries || {}).forEach(([dk, val]) => {
    const pk = getPeriodKey(parseKey(dk), period);
    buckets.set(pk, (buckets.get(pk) || 0) + (val || 0));
  });
  return keys.map(k => ({ key:k, label:formatPeriodLabel(k, period), value:buckets.get(k) || 0 }));
}

function ScoreChart({ data, color, height = 180 }) {
  const W = 640, H = height;
  const padL = 8, padR = 8, padT = 16, padB = 28;
  const max = Math.max(1, ...data.map(d => d.value)) * 1.2 || 1;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;
  const n = data.length;
  const step = n > 1 ? innerW / (n - 1) : innerW;
  const pts = data.map((d, i) => [padL + i * step, padT + innerH - (d.value / max) * innerH]);
  const linePath = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0] + "," + p[1]).join(" ");
  const areaPath = linePath + ` L${padL + (n-1)*step},${padT+innerH} L${padL},${padT+innerH} Z`;
  const gid = "g-" + color.replace("#","");
  return (
    <div className="chart-wrap" style={{ height }}>
      <svg viewBox={`0 0 ${W} ${H}`} className="chart-svg" preserveAspectRatio="none">
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.35" /><stop offset="100%" stopColor={color} stopOpacity="0.02" /></linearGradient></defs>
        {[0.25, 0.5, 0.75, 1].map((f, i) => <line key={i} x1={padL} x2={W-padR} y1={padT + innerH*(1-f)} y2={padT + innerH*(1-f)} stroke="currentColor" strokeOpacity="0.06" />)}
        <path d={areaPath} fill={`url(#${gid})`} />
        <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" style={{ filter: `drop-shadow(0 0 6px ${color}55)` }} />
        {pts.map((p, i) => <circle key={i} className="chart-dot" cx={p[0]} cy={p[1]} r="3.2" fill={color} stroke="var(--bg)" strokeWidth="2"><title>{data[i].label}: {data[i].value}</title></circle>)}
        {data.map((d, i) => i % Math.max(1, Math.ceil(n / 6)) === 0 ? <text key={i} x={padL + i*step} y={H-8} fontSize="10" fill="currentColor" opacity="0.45" textAnchor="middle" fontFamily="JetBrains Mono, monospace">{d.label}</text> : null)}
      </svg>
    </div>
  );
}

function HistoryBars({ data, color, height = 140 }) {
  const max = Math.max(1, ...data.map(d => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height, paddingTop: 8 }}>
      {data.map((d, i) => {
        const h = Math.max(3, (d.value / max) * (height - 28));
        return (
          <div key={d.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
            <div style={{ position:"relative", width: "100%", maxWidth: 28, height: h, borderRadius: "5px 5px 2px 2px", background: color, opacity: d.value > 0 ? 1 : 0.15, transformOrigin: "bottom", animation: `barGrow 0.55s ${0.03 * i}s var(--ease) both` }}>
              {d.value > 0 && <div style={{ position: "absolute", top: -18, left: "50%", transform: "translateX(-50%)", fontSize: 10, fontFamily: "JetBrains Mono", color: "var(--muted)", whiteSpace: "nowrap" }}>{d.value}</div>}
            </div>
            <span style={{ fontSize: 9, color: "var(--faint)", fontFamily: "JetBrains Mono" }}>{d.label.length > 5 ? d.label.slice(0,4) : d.label}</span>
          </div>
        );
      })}
    </div>
  );
}

function PeriodSelect({ value, onChange }) {
  const options = [{ id:"day", label:"Day" }, { id:"week", label:"Week" }, { id:"month", label:"Month" }, { id:"year", label:"Year" }];
  return (
    <div style={{ display: "flex", background: "var(--surface2)", borderRadius: 8, padding: 3, gap: 2 }}>
      {options.map(o => <button key={o.id} onClick={() => onChange(o.id)} className="tap" style={{ padding: "5px 12px", borderRadius: 6, fontSize: 12, fontWeight: 500, background: value === o.id ? "var(--surface)" : "transparent", color: value === o.id ? "var(--text)" : "var(--muted)", boxShadow: value === o.id ? "0 1px 3px rgba(0,0,0,0.25)" : "none" }}>{o.label}</button>)}
    </div>
  );
}

function ProgressRow({ label, value, total, color }) {
  const pct = total > 0 ? Math.min(100, (value / total) * 100) : 0;
  const display = value >= 1000 ? (value/1000).toFixed(1) + "k" : value;
  const totalDisp = total >= 1000 ? (total/1000).toFixed(1) + "k" : total;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 10 }}>
      <span style={{ width: 56, fontSize: 12, color: "var(--muted)", fontWeight: 500 }}>{label}</span>
      <div className="progress-track" style={{ flex: 1 }}><div className="progress-fill" style={{ width: pct + "%", background: color }} /></div>
      <span style={{ width: 70, textAlign: "right", fontSize: 12, fontFamily: "JetBrains Mono", color: "var(--text)" }}>{display}{total > 0 ? ` / ${totalDisp}` : ""}</span>
    </div>
  );
}

function App() {
  const [habits, setHabits] = useState([]);
  const [entries, setEntries] = useState({});
  const [selectedId, setSelectedId] = useState(null);
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "dark");
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("score");
  const [period, setPeriod] = useState("day");
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [toast, setToast] = useState(null);
  const [calMonth, setCalMonth] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const fileInputRef = useRef();

  useEffect(() => {
    const data = loadData();
    setHabits(data.habits || []);
    setEntries(data.entries || {});
    if (data.habits?.length) setSelectedId(data.habits[0].id);
    setLoaded(true);
  }, []);

  useEffect(() => { if (loaded) saveData(habits, entries); }, [habits, entries, loaded]);

  useEffect(() => {
    localStorage.setItem(THEME_KEY, theme);
    document.documentElement.style.setProperty("--bg", theme === "dark" ? "#0F1115" : "#F6F4EF");
    document.documentElement.style.setProperty("--surface", theme === "dark" ? "#161A21" : "#FFFFFF");
    document.documentElement.style.setProperty("--surface2", theme === "dark" ? "#1C222C" : "#F0EDE5");
    document.documentElement.style.setProperty("--border", theme === "dark" ? "#2A3140" : "#E4E0D5");
    document.documentElement.style.setProperty("--text", theme === "dark" ? "#F0EDE6" : "#20242B");
    document.documentElement.style.setProperty("--muted", theme === "dark" ? "#8B92A0" : "#6B7280");
    document.documentElement.style.setProperty("--faint", theme === "dark" ? "#5A6270" : "#9A9488");
  }, [theme]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const selectedHabit = habits.find(h => h.id === selectedId);
  const selectedEntries = selectedHabit ? (entries[selectedHabit.id] || {}) : {};

  const series = useMemo(() => {
    if (!selectedHabit) return [];
    const count = period === "day" ? 14 : period === "week" ? 12 : period === "month" ? 12 : 6;
    return buildSeries(selectedEntries, period, count);
  }, [selectedEntries, period, selectedHabit]);

  const periodTotals = useMemo(() => {
    if (!selectedHabit) return { today:0, week:0, month:0, quarter:0, year:0 };
    const now = new Date();
    const today = selectedEntries[todayKey()] || 0;
    let week = 0, month = 0, quarter = 0, year = 0;
    const weekStart = startOfWeek(now);
    const monthStart = startOfMonth(now);
    const quarterStart = new Date(now.getFullYear(), Math.floor(now.getMonth()/3)*3, 1);
    const yearStart = startOfYear(now);
    Object.entries(selectedEntries).forEach(([k, v]) => {
      const d = parseKey(k);
      if (d >= weekStart) week += v;
      if (d >= monthStart) month += v;
      if (d >= quarterStart) quarter += v;
      if (d >= yearStart) year += v;
    });
    return { today, week, month, quarter, year };
  }, [selectedEntries, selectedHabit]);

  const streak = selectedHabit ? computeStreak(selectedEntries, selectedHabit.goal) : 0;

  function setValue(habitId, key, val) {
    setEntries(prev => {
      const next = { ...prev };
      const he = { ...(next[habitId] || {}) };
      if (val === null || val === "" || isNaN(val) || val < 0) delete he[key];
      else he[key] = Number(val);
      next[habitId] = he;
      return next;
    });
  }

  function addHabit(h) {
    const id = uid();
    setHabits(prev => [...prev, { ...h, id }]);
    setSelectedId(id);
    setShowAdd(false);
    setToast("Habit created");
  }

  function updateHabit(id, patch) {
    setHabits(prev => prev.map(h => h.id === id ? { ...h, ...patch } : h));
    setEditing(null);
    setToast("Saved");
  }

  function deleteHabit(id) {
    setHabits(prev => prev.filter(h => h.id !== id));
    setEntries(prev => { const n = {...prev}; delete n[id]; return n; });
    if (selectedId === id) setSelectedId(habits.find(h => h.id !== id)?.id || null);
    setEditing(null);
    setToast("Habit removed");
  }

  function exportData() {
    const data = JSON.stringify({habits, entries}, null, 2);
    const filename = `tally-backup-${todayKey()}.json`;
    if (window.TallyAndroid) {
      window.TallyAndroid.saveBackup(data, filename);
      setToast("Choose where to save your backup");
      return;
    }
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    setToast("Backup downloaded");
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!parsed.habits) throw new Error();
        setHabits(parsed.habits);
        setEntries(parsed.entries || {});
        setSelectedId(parsed.habits[0]?.id || null);
        setToast("Backup restored");
      } catch {
        setToast("Invalid backup file");
      }
    };
    reader.readAsText(file);
  }

  const grid = useMemo(() => buildMonthGrid(calMonth), [calMonth]);

  if (!loaded) {
    return <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--muted)" }}>Loading your ledger…</div>;
  }

  return (
    <div style={{ minHeight:"100vh", background:"var(--bg)", color:"var(--text)", paddingBottom:48 }}>
      <div style={{ position:"sticky", top:0, zIndex:40, background:"color-mix(in srgb, var(--bg) 92%, transparent)", backdropFilter:"blur(12px)", borderBottom:"1px solid var(--border)", padding:"12px 16px" }}>
        <div style={{ maxWidth:520, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            {selectedHabit && <button onClick={() => setSelectedId(null)} className="tap" style={{ padding:6, color:"var(--muted)" }}><Icon name="chevron-left" size={20} /></button>}
            <h1 style={{ fontSize:18, fontWeight:600, letterSpacing:"-0.02em" }}>{selectedHabit ? selectedHabit.name : "Tally"}</h1>
          </div>
          <div style={{ display:"flex", gap:6 }}>
            <button onClick={() => setTheme(t => t === "dark" ? "light" : "dark")} className="tap" title="Toggle theme" style={{ padding:8, borderRadius:8, background:"var(--surface2)", color:"var(--muted)" }}><Icon name={theme === "dark" ? "sun" : "moon"} size={16} /></button>
            {selectedHabit && <button onClick={() => setEditing(selectedHabit)} className="tap" title="Edit habit" style={{ padding:8, borderRadius:8, background:"var(--surface2)", color:"var(--muted)" }}><Icon name="edit" size={16} /></button>}
            <button onClick={() => setShowAdd(true)} className="tap" title="New habit" style={{ padding:8, borderRadius:8, background:"var(--surface2)", color:"var(--text)" }}><Icon name="plus" size={16} /></button>
          </div>
        </div>
      </div>

      <div style={{ maxWidth:520, margin:"0 auto", padding:16 }}>
        {!selectedHabit && (
          <div className="fade-up">
            {habits.length === 0 ? (
              <div className="card" style={{ textAlign:"center", padding:"48px 24px" }}>
                <div style={{ fontSize:40, marginBottom:12, opacity:0.4 }}>◇</div>
                <p style={{ fontSize:17, fontWeight:600, marginBottom:6 }}>No habits yet</p>
                <p style={{ color:"var(--muted)", fontSize:13, marginBottom:20 }}>Create your first habit to start tracking.</p>
                <button onClick={() => setShowAdd(true)} className="tap" style={{ background:"var(--accent)", color:"#0F1115", fontWeight:600, padding:"11px 22px", borderRadius:10, fontSize:14 }}>Add habit</button>
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {habits.map((h, i) => {
                  const he = entries[h.id] || {};
                  const todayVal = he[todayKey()] || 0;
                  const st = computeStreak(he, h.goal);
                  return (
                    <button key={h.id} onClick={() => setSelectedId(h.id)} className="tap card fade-up" style={{ display:"flex", alignItems:"center", gap:14, textAlign:"left", animationDelay:`${i * 0.04}s`, borderLeft:`3px solid ${h.color}` }}>
                      <div style={{ width:40, height:40, borderRadius:12, background:h.color + "22", display:"flex", alignItems:"center", justifyContent:"center", color:h.color, fontWeight:700, fontSize:15 }}>{todayVal || "·"}</div>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontWeight:600, fontSize:15 }}>{h.name}</div>
                        <div style={{ fontSize:12, color:"var(--muted)", marginTop:2 }}>{h.goal > 0 ? `Goal ${h.goal}${h.unit ? " " + h.unit : ""}` : "No goal"} · {st} day streak</div>
                      </div>
                      <Icon name="chevron-right" size={16} color="var(--faint)" />
                    </button>
                  );
                })}
              </div>
            )}

            <div style={{ marginTop:28, display:"flex", gap:8, justifyContent:"center" }}>
              <button onClick={exportData} className="tap" style={{ fontSize:12, color:"var(--muted)", display:"flex", alignItems:"center", gap:5 }}><Icon name="download" size={13} /> Backup</button>
              <button onClick={() => fileInputRef.current?.click()} className="tap" style={{ fontSize:12, color:"var(--muted)", display:"flex", alignItems:"center", gap:5 }}><Icon name="upload" size={13} /> Restore</button>
              <input ref={fileInputRef} type="file" accept="application/json" style={{ display:"none" }} onChange={e => e.target.files[0] && importData(e.target.files[0])} />
            </div>
          </div>
        )}

        {selectedHabit && (
          <div className="fade-up">
            <div className="card" style={{ marginBottom:16 }}>
              <ProgressRow label="Today" value={periodTotals.today} total={selectedHabit.goal || 0} color={selectedHabit.color} />
              <ProgressRow label="Week" value={periodTotals.week} total={(selectedHabit.goal || 0) * 7} color={selectedHabit.color} />
              <ProgressRow label="Month" value={periodTotals.month} total={(selectedHabit.goal || 0) * 30} color={selectedHabit.color} />
              <ProgressRow label="Quarter" value={periodTotals.quarter} total={(selectedHabit.goal || 0) * 90} color={selectedHabit.color} />
              <ProgressRow label="Year" value={periodTotals.year} total={(selectedHabit.goal || 0) * 365} color={selectedHabit.color} />
            </div>

            <div style={{ display:"flex", gap:10, marginBottom:16 }}>
              <div className="card" style={{ flex:1, display:"flex", alignItems:"center", gap:10 }}>
                <div style={{ color:selectedHabit.color }}><Icon name="flame" size={20} /></div>
                <div><div style={{ fontSize:20, fontWeight:700, fontFamily:"JetBrains Mono" }}>{streak}</div><div style={{ fontSize:11, color:"var(--muted)" }}>day streak</div></div>
              </div>
              <div className="card" style={{ flex:1.4, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <span style={{ fontSize:13, color:"var(--muted)" }}>Today</span>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <button className="tap" onClick={() => setValue(selectedHabit.id, todayKey(), Math.max(0, (selectedEntries[todayKey()] || 0) - 1))} style={{ width:32, height:32, borderRadius:8, background:"var(--surface2)", display:"grid", placeItems:"center" }}><Icon name="minus" size={14} /></button>
                  <span style={{ fontFamily:"JetBrains Mono", fontWeight:600, minWidth:28, textAlign:"center" }}>{selectedEntries[todayKey()] || 0}</span>
                  <button className="tap" onClick={() => setValue(selectedHabit.id, todayKey(), (selectedEntries[todayKey()] || 0) + 1)} style={{ width:32, height:32, borderRadius:8, background:selectedHabit.color, color:"#0F1115", display:"grid", placeItems:"center" }}><Icon name="plus" size={14} /></button>
                </div>
              </div>
            </div>

            <div style={{ display:"flex", gap:8, marginBottom:16 }}>
              <button onClick={() => setView("score")} className="tap" style={{ flex:1, padding:9, borderRadius:10, fontSize:13, fontWeight:500, background:view === "score" ? "var(--surface)" : "transparent", border:`1px solid ${view === "score" ? "var(--border)" : "transparent"}`, color:view === "score" ? "var(--text)" : "var(--muted)" }}>Score</button>
              <button onClick={() => setView("calendar")} className="tap" style={{ flex:1, padding:9, borderRadius:10, fontSize:13, fontWeight:500, background:view === "calendar" ? "var(--surface)" : "transparent", border:`1px solid ${view === "calendar" ? "var(--border)" : "transparent"}`, color:view === "calendar" ? "var(--text)" : "var(--muted)" }}>Calendar</button>
            </div>

            {view === "score" && <>
              <div className="card" style={{ marginBottom:16 }}><div className="section-title"><span>Score</span><PeriodSelect value={period} onChange={setPeriod} /></div><ScoreChart data={series} color={selectedHabit.color} height={190} /></div>
              <div className="card"><div className="section-title"><span>History</span><PeriodSelect value={period} onChange={setPeriod} /></div><HistoryBars data={series} color={selectedHabit.color} height={150} /></div>
            </>}

            {view === "calendar" && (
              <div className="card">
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
                  <button onClick={() => setCalMonth(new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1))} className="tap" style={{ padding:6, color:"var(--muted)" }}><Icon name="chevron-left" size={18} /></button>
                  <span style={{ fontWeight:600, fontSize:15 }}>{monthLabel(calMonth)}</span>
                  <button onClick={() => setCalMonth(new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1))} className="tap" style={{ padding:6, color:"var(--muted)" }}><Icon name="chevron-right" size={18} /></button>
                </div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:6, marginBottom:8 }}>{["S","M","T","W","T","F","S"].map((d, i) => <div key={i} style={{ textAlign:"center", fontSize:11, color:"var(--faint)", fontWeight:500 }}>{d}</div>)}</div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:6 }}>
                  {grid.map((d, i) => {
                    if (!d) return <div key={i} />;
                    const k = dateKey(d), val = selectedEntries[k] || 0;
                    const met = goalMet(val, selectedHabit.goal), isToday = sameDay(d, new Date()), isFuture = d > new Date();
                    return <button key={i} disabled={isFuture} onClick={() => {
                      const next = prompt(`Value for ${k}`, String(val || ""));
                      if (next !== null) setValue(selectedHabit.id, k, next === "" ? null : Number(next));
                    }} className={`tap ${met ? "day-glow" : ""}`} style={{ aspectRatio:"1", borderRadius:10, fontSize:13, fontWeight:isToday ? 700 : 500, background:met ? selectedHabit.color + "33" : isToday ? "var(--surface2)" : "transparent", border:isToday ? `1.5px solid ${selectedHabit.color}` : "1px solid transparent", color:isFuture ? "var(--faint)" : met ? selectedHabit.color : "var(--text)", "--habit-color":selectedHabit.color }}>{d.getDate()}</button>;
                  })}
                </div>
                <p style={{ marginTop:14, fontSize:11, color:"var(--faint)" }}>Days that glow reached the goal. Tap any past day to log or edit.</p>
              </div>
            )}
          </div>
        )}
      </div>

      {toast && <div className="scale-in" style={{ position:"fixed", bottom:28, left:"50%", transform:"translateX(-50%)", background:"var(--surface)", border:"1px solid var(--border)", padding:"10px 18px", borderRadius:99, fontSize:13, fontWeight:500, boxShadow:"0 8px 24px rgba(0,0,0,0.35)", zIndex:100 }}>{toast}</div>}

      {(showAdd || editing) && <HabitModal initial={editing} onClose={() => { setShowAdd(false); setEditing(null); }} onSave={editing ? p => updateHabit(editing.id, p) : addHabit} onDelete={editing ? () => deleteHabit(editing.id) : null} />}
    </div>
  );
}

function HabitModal({ initial, onClose, onSave, onDelete }) {
  const [name, setName] = useState(initial?.name || "");
  const [color, setColor] = useState(initial?.color || CATEGORY_COLORS[0].hex);
  const [goal, setGoal] = useState(initial?.goal ?? 1);
  const [unit, setUnit] = useState(initial?.unit || "");

  function submit() {
    if (!name.trim()) return;
    onSave({ name:name.trim(), color, goal:Number(goal) || 0, unit:unit.trim() });
  }

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.55)", zIndex:80, display:"flex", alignItems:"flex-end", justifyContent:"center", padding:12 }} onClick={onClose}>
      <div className="scale-in card" style={{ width:"100%", maxWidth:400, padding:22, marginBottom:8 }} onClick={e => e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}><h2 style={{ fontSize:17, fontWeight:600 }}>{initial ? "Edit habit" : "New habit"}</h2><button onClick={onClose} className="tap" style={{ color:"var(--muted)" }}><Icon name="x" size={18} /></button></div>
        <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
          <div><label style={{ fontSize:11, color:"var(--muted)", fontFamily:"JetBrains Mono", display:"block", marginBottom:6 }}>NAME</label><input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Jumping squats" autoFocus style={{ width:"100%", background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:10, padding:"11px 14px", fontSize:15 }} /></div>
          <div><label style={{ fontSize:11, color:"var(--muted)", fontFamily:"JetBrains Mono", display:"block", marginBottom:8 }}>COLOR</label><div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>{CATEGORY_COLORS.map(c => <button key={c.hex} onClick={() => setColor(c.hex)} className="tap" title={c.name} style={{ width:30, height:30, borderRadius:"50%", background:c.hex, outline:color === c.hex ? "2px solid white" : "none", outlineOffset:2 }} />)}</div></div>
          <div style={{ display:"flex", gap:12 }}>
            <div style={{ flex:1 }}><label style={{ fontSize:11, color:"var(--muted)", fontFamily:"JetBrains Mono", display:"block", marginBottom:6 }}>DAILY GOAL</label><input type="number" value={goal} onChange={e => setGoal(e.target.value)} style={{ width:"100%", background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:10, padding:"11px 14px", fontSize:15, fontFamily:"JetBrains Mono" }} /></div>
            <div style={{ flex:1 }}><label style={{ fontSize:11, color:"var(--muted)", fontFamily:"JetBrains Mono", display:"block", marginBottom:6 }}>UNIT</label><input value={unit} onChange={e => setUnit(e.target.value)} placeholder="reps, min…" style={{ width:"100%", background:"var(--surface2)", border:"1px solid var(--border)", borderRadius:10, padding:"11px 14px", fontSize:15 }} /></div>
          </div>
          <button onClick={submit} className="tap" style={{ marginTop:6, width:"100%", padding:13, borderRadius:12, background:color, color:"#0F1115", fontSize:15, fontWeight:700 }}>{initial ? "Save changes" : "Create habit"}</button>
          {onDelete && <button onClick={onDelete} className="tap" style={{ width:"100%", padding:11, borderRadius:12, color:"#FF6B6B", fontSize:13 }}>Delete habit</button>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
