<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Habit &amp; Goal Tracker</title>
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    :root{--bg-base:#0f1115;--bg-surface:#181b20;--bg-surface-elevated:#21262d;--bg-track:#2b3038;--border-subtle:rgba(255,255,255,.07);--border-focus:rgba(82,229,150,.45);--text-primary:#f3f5f8;--text-secondary:#9ba3b0;--text-muted:#68707d;--accent:#52e596;--accent-strong:#34d37d;--accent-soft:rgba(82,229,150,.16);--accent-glow:rgba(82,229,150,.35);--danger:#ff5c6c;--radius-lg:16px;--radius-md:12px;--radius-sm:8px;--spring:cubic-bezier(.22,1,.36,1);--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{background:var(--bg-base);color:var(--text-primary);font-family:var(--font-sans);min-height:100vh;overflow-x:hidden;line-height:1.45;display:flex;justify-content:center}.app-shell{width:100%;max-width:540px;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:48px}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(15,17,21,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-subtle)}.topbar-left,.topbar-actions{display:flex;align-items:center;gap:8px;min-width:0}.topbar-title-wrap{min-width:0}.topbar-title{font-size:18px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar-subtitle{font-size:11px;color:var(--text-secondary)}button,select,input{font:inherit;color:inherit}.icon-btn{width:38px;height:38px;border-radius:50%;background:transparent;display:grid;place-items:center;flex:none}.icon-btn svg{width:21px;height:21px;fill:currentColor}.icon-btn:active,.quick-log-pill:active,.btn:active{transform:scale(.95)}.quick-log-pill{height:36px;padding:0 12px;border:1px solid var(--border-focus);border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:650;font-size:13px}.view-panel{display:none;flex-direction:column;gap:12px;padding:12px;animation:fadeUp .3s var(--spring)}.view-panel.active{display:flex}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.card{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:16px;position:relative;box-shadow:0 8px 26px -14px #000}.card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.card-title{font-size:16px;font-weight:650;color:var(--accent)}.card-controls,.select-wrapper,.pan-group,.calendar-nav{display:flex;align-items:center;gap:6px}.select-wrapper{position:relative}.period-select{appearance:none;background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:8px;padding:6px 26px 6px 9px;font-size:12px}.select-arrow{position:absolute;right:7px;width:13px;pointer-events:none}.pan-group{gap:0;background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:8px;overflow:hidden}.pan-btn{width:30px;height:30px;display:grid;place-items:center;color:var(--text-secondary);font-size:20px;line-height:1}.pan-btn:disabled{opacity:.3}.targets-stack{display:flex;flex-direction:column;gap:8px}.target-row{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:10px}.target-label{text-align:right;font-size:12px;color:var(--text-secondary)}.target-track{height:27px;background:var(--bg-track);border-radius:6px;position:relative;overflow:hidden;display:flex;align-items:center}.target-fill{height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:5px 0 0 5px;transition:width .6s var(--spring);box-shadow:2px 0 10px var(--accent-glow)}.target-fill.completed{border-radius:5px}.target-current,.target-goal,.target-pct{position:absolute;z-index:2;font-size:11px;font-weight:600;pointer-events:none}.target-current{left:9px;color:#0b1710}.target-current.outside{color:var(--text-primary)}.target-goal{left:50%;transform:translateX(-50%);color:var(--text-secondary)}.target-pct{right:8px;color:var(--text-muted)}.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-subtle)}.kpi-box{background:rgba(255,255,255,.025);border:1px solid var(--border-subtle);border-radius:10px;padding:8px 4px;text-align:center;min-width:0}.kpi-val{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis}.kpi-val.accent{color:var(--accent)}.kpi-lbl{font-size:9px;color:var(--text-secondary);margin-top:2px;text-transform:uppercase}.chart-stage{width:100%;position:relative}.chart-svg{width:100%;height:auto;display:block;overflow:visible}.chart-grid-line{stroke:rgba(255,255,255,.08);stroke-width:1}.chart-baseline{stroke:rgba(255,255,255,.16);stroke-width:1.2}.chart-label{fill:var(--text-secondary);font-size:10px;text-anchor:middle}.chart-sublabel{fill:var(--text-muted);font-size:9px;text-anchor:middle}.chart-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-subtle);font-size:11px;color:var(--text-secondary)}.segmented{display:flex;background:var(--bg-surface-elevated);padding:2px;border-radius:7px}.seg-btn{padding:5px 8px;border-radius:5px;color:var(--text-secondary);font-size:10px;font-weight:600}.seg-btn.active{background:var(--accent-soft);color:var(--accent)}.chart-tooltip{position:absolute;z-index:10;pointer-events:none;background:#181b20f5;border:1px solid var(--border-focus);border-radius:7px;padding:5px 8px;font-size:11px;opacity:0;transform:translate(-50%,-110%)}.chart-tooltip.visible{opacity:1}.calendar-month-label{font-size:13px;font-weight:600;min-width:78px;text-align:center}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar-weekdays{font-size:10px;color:var(--text-muted);font-weight:600;margin-bottom:7px}.cal-day{aspect-ratio:1;border-radius:8px;background:var(--bg-surface-elevated);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-width:0}.cal-day.today{border-color:var(--accent)}.cal-day.logged-partial{background:#52e59638}.cal-day.logged-full{background:var(--accent);color:#08140d;font-weight:700}.cal-day.empty{background:transparent;cursor:default}.cal-day-num{font-size:12px}.cal-day-val{font-size:8px}.streaks-list{display:flex;flex-direction:column;gap:8px}.streak-item{display:grid;grid-template-columns:minmax(65px,90px) 1fr minmax(65px,90px);align-items:center;gap:8px;font-size:10px;color:var(--text-secondary)}.streak-bar-wrap{height:21px;background:var(--bg-track);border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}.streak-bar-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-strong),var(--accent));border-radius:6px}.streak-bar-text{z-index:1;font-size:10px;font-weight:700;text-shadow:0 1px 3px #000}.habit-item{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.habit-main{display:flex;align-items:center;gap:12px;min-width:0}.habit-ring{width:44px;height:44px;border-radius:13px;background:var(--bg-surface-elevated);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}.habit-meta{min-width:0}.habit-meta h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.habit-meta p{font-size:11px;color:var(--text-secondary)}.dropdown-menu{position:absolute;right:10px;top:58px;z-index:60;display:none;flex-direction:column;min-width:190px;padding:5px;background:var(--bg-surface-elevated);border:1px solid #ffffff20;border-radius:10px;box-shadow:0 12px 30px #000a}.dropdown-menu.open{display:flex}.menu-item{text-align:left;padding:10px;border-radius:7px;font-size:12px}.menu-item:hover{background:#ffffff12}.modal-backdrop{position:fixed;inset:0;z-index:100;background:#05070acc;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal-card{width:100%;max-width:390px;background:var(--bg-surface);border:1px solid #ffffff20;border-radius:16px;padding:20px;box-shadow:0 20px 44px #000b}.modal-title{font-size:17px;font-weight:650}.modal-sub{font-size:12px;color:var(--text-secondary);margin:4px 0 16px}.form-group{margin-bottom:13px}.form-label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:5px}.form-input{width:100%;background:var(--bg-surface-elevated);border:1px solid var(--border-subtle);border-radius:8px;padding:10px;color:var(--text-primary);font-size:14px}.color-swatches{display:flex;gap:9px}.color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.color-swatch.selected{border-color:#fff;transform:scale(1.12)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{padding:9px 14px;border-radius:8px;font-size:12px;font-weight:650}.btn-ghost{color:var(--text-secondary)}.btn-primary{background:var(--accent);color:#08150e}.btn-danger{color:var(--danger)}@media(max-width:420px){.kpi-strip{grid-template-columns:repeat(2,1fr)}.target-row{grid-template-columns:52px 1fr}.card{padding:14px}.card-controls{gap:4px}.period-select{font-size:11px;padding-left:7px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="backBtn" title="Switch view" aria-label="Switch view"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <div class="topbar-title-wrap"><h1 class="topbar-title" id="topTitle">Tally</h1><div class="topbar-subtitle" id="topSubtitle"></div></div>
      </div>
      <div class="topbar-actions">
        <button class="quick-log-pill" id="quickLogBtn">+ Log</button>
        <button class="icon-btn" id="editHabitBtn" title="Edit habit" aria-label="Edit habit"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.42l-2.34-2.34a1 1 0 0 0-1.42 0l-1.83 1.83 3.75 3.75z"/></svg></button>
        <button class="icon-btn" id="menuBtn" title="More options" aria-label="More options"><svg viewBox="0 0 24 24"><path d="M12 5a2 2 0 1 0 0 .01zM12 10a2 2 0 1 0 0 .01zM12 15a2 2 0 1 0 0 .01z"/></svg></button>
      </div>
      <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" id="menuNewHabit">＋ Create new habit</button>
        <button class="menu-item" id="menuLoadSample">↺ Reset demo data</button>
        <button class="menu-item" id="menuExport">⇩ Export backup (JSON)</button>
        <button class="menu-item" id="menuImport">⇧ Import backup (JSON)</button>
      </div>
    </header>
    <main class="view-panel active" id="detailView">
      <section class="card" aria-label="Target progress"><div class="targets-stack" id="targetsStack"></div><div class="kpi-strip" id="kpiStrip"></div></section>
      <section class="card" aria-label="Score chart">
        <div class="card-header"><h2 class="card-title">Score</h2><div class="card-controls"><div class="pan-group"><button class="pan-btn" id="scorePrevBtn" title="Previous period">‹</button><button class="pan-btn" id="scoreNextBtn" title="Next period">›</button></div><div class="select-wrapper"><select class="period-select" id="scorePeriodSelect"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="quarter">Quarter</option><option value="year">Year</option></select><svg class="select-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></div></div></div>
        <div class="chart-stage"><div class="chart-tooltip" id="scoreTooltip"></div><svg class="chart-svg" id="scoreSvg" viewBox="0 0 500 225"></svg></div>
        <div class="chart-footer"><span>Tap any dot to inspect or log</span><div class="segmented" id="scoreModeToggle"><button class="seg-btn active" data-mode="ema">Habit score</button><button class="seg-btn" data-mode="direct">Target %</button></div></div>
      </section>
      <section class="card" aria-label="History chart">
        <div class="card-header"><h2 class="card-title">History</h2><div class="card-controls"><div class="pan-group"><button class="pan-btn" id="historyPrevBtn" title="Previous period">‹</button><button class="pan-btn" id="historyNextBtn" title="Next period">›</button></div><div class="select-wrapper"><select class="period-select" id="historyPeriodSelect"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="quarter">Quarter</option><option value="year">Year</option></select><svg class="select-arrow" viewBox="0 0 24 24"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg></div></div></div>
        <div class="chart-stage"><div class="chart-tooltip" id="historyTooltip"></div><svg class="chart-svg" id="historySvg" viewBox="0 0 500 215"></svg></div>
      </section>
      <section class="card" aria-label="Interactive calendar"><div class="card-header"><h2 class="card-title">Calendar</h2><div class="calendar-nav"><button class="pan-btn" id="calPrevBtn" title="Previous month">‹</button><span class="calendar-month-label" id="calMonthLabel"></span><button class="pan-btn" id="calNextBtn" title="Next month">›</button></div></div><div class="calendar-weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="calendar-grid" id="calendarGrid"></div></section>
      <section class="card" aria-label="Best streaks"><div class="card-header"><h2 class="card-title">Best Streaks</h2></div><div class="streaks-list" id="streaksList"></div></section>
    </main>
    <section class="view-panel" id="listView"><div id="habitsListContainer" style="display:flex;flex-direction:column;gap:9px"></div><button class="btn btn-primary" id="createHabitFromListBtn">+ Add new habit</button></section>
  </div>
  <div class="modal-backdrop" id="logModal"><div class="modal-card"><h3 class="modal-title" id="logModalTitle">Log entry</h3><p class="modal-sub" id="logModalDateSub"></p><div class="form-group"><label class="form-label" for="logValueInput">Completed amount</label><input type="number" step="any" min="0" class="form-input" id="logValueInput" placeholder="e.g. 50"><div class="color-swatches" id="logPresetChips" style="margin-top:8px"></div></div><div class="modal-actions"><button class="btn btn-ghost" id="logClearBtn">Clear</button><button class="btn btn-ghost" id="logCancelBtn">Cancel</button><button class="btn btn-primary" id="logSaveBtn">Save</button></div></div></div>
  <div class="modal-backdrop" id="habitModal"><div class="modal-card"><h3 class="modal-title" id="habitModalHeader">Edit habit</h3><p class="modal-sub">Customize target, unit, and accent</p><div class="form-group"><label class="form-label" for="habitNameInput">Habit name</label><input class="form-input" id="habitNameInput" placeholder="e.g. Jumping squats"></div><div class="form-group"><label class="form-label" for="habitTargetInput">Daily target</label><input type="number" step="any" min="1" class="form-input" id="habitTargetInput"></div><div class="form-group"><label class="form-label" for="habitUnitInput">Unit label</label><input class="form-input" id="habitUnitInput" placeholder="reps, min, pages"></div><div class="form-group"><label class="form-label">Theme color</label><div class="color-swatches" id="colorSwatches"></div></div><div class="modal-actions"><button class="btn btn-danger" id="habitDeleteBtn">Delete</button><button class="btn btn-ghost" id="habitCancelBtn">Cancel</button><button class="btn btn-primary" id="habitSaveBtn">Save</button></div></div></div>
  <input type="file" id="importFileInput" accept="application/json,.json" hidden>
  <script>
    const DATA_KEY = "neoaru_tracker_app_v2";
    const LEGACY_KEY = "tally-data-v1";
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const COLORS = [{name:"Emerald",color:"#52e596",strong:"#34d37d"},{name:"Cyan",color:"#38bdf8",strong:"#0284c7"},{name:"Violet",color:"#a78bfa",strong:"#7c3aed"},{name:"Amber",color:"#fbbf24",strong:"#d97706"},{name:"Rose",color:"#fb7185",strong:"#e11d48"}];
    const today = new Date(); today.setHours(12,0,0,0);
    const pad = n => String(n).padStart(2,"0");
    const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const fromKey = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d,12); };
    const addDays = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
    const monday = d => addDays(d, -(d.getDay()+6)%7);
    const shortNum = n => n>=1000 ? (n/1000).toFixed(1)+"k" : Number.isInteger(n) ? String(n) : n.toFixed(1);
    const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function seedLogs(){
      const logs={}; let remaining=2970, cursor=new Date(2026,0,5,12), cutoff=new Date(2026,9,10,12);
      while(cursor<=cutoff&&remaining>0){const batch=Math.min(50,remaining);logs[keyOf(cursor)]=batch;remaining-=batch;cursor=addDays(cursor,3);}
      logs["2026-11-07"]=30; return logs;
    }
    function defaultState(){return {activeHabitId:"jumping-squats",scoreMode:"ema",habits:[
      {id:"jumping-squats",name:"Jumping squats",dailyTarget:50,yearlyTarget:15300,unit:"reps",color:"#52e596",colorStrong:"#34d37d",logs:seedLogs()},
      {id:"deep-work",name:"Deep Coding Session",dailyTarget:90,yearlyTarget:32850,unit:"min",color:"#38bdf8",colorStrong:"#0284c7",logs:{"2026-10-29":90,"2026-10-30":60,"2026-11-01":90,"2026-11-02":90,"2026-11-04":120,"2026-11-05":90,"2026-11-07":90,"2026-11-08":75,"2026-11-09":90}}
    ]};}
    function migrateLegacy(){
      try{const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||"null");if(old?.habits?.length){return {activeHabitId:old.habits[0].id,scoreMode:"ema",habits:old.habits.map(h=>({id:h.id,name:h.name,dailyTarget:Number(h.goal)||1,yearlyTarget:(Number(h.goal)||1)*365,unit:h.unit||"",color:h.color||COLORS[0].color,colorStrong:COLORS[0].strong,logs:old.entries?.[h.id]||{}}))};}}catch(e){}return null;
    }
    function loadState(){try{const s=JSON.parse(localStorage.getItem(DATA_KEY)||"null");if(s?.habits?.length)return s;}catch(e){}return migrateLegacy()||defaultState();}
    let state=loadState(), currentView="detail", scorePeriod="day", historyPeriod="day", scoreOffset=0, historyOffset=0, calYear=today.getFullYear(), calMonth=today.getMonth(), editingDate=null, editingId=null, creating=false, selectedColor=COLORS[0];
    function save(){try{localStorage.setItem(DATA_KEY,JSON.stringify(state));}catch(e){}}
    function active(){return state.habits.find(h=>h.id===state.activeHabitId)||state.habits[0];}
    function applyColor(h){const r=document.documentElement.style;r.setProperty("--accent",h.color||COLORS[0].color);r.setProperty("--accent-strong",h.colorStrong||COLORS[0].strong);r.setProperty("--accent-soft",(h.color||COLORS[0].color)+"28");r.setProperty("--accent-glow",(h.color||COLORS[0].color)+"55");r.setProperty("--border-focus",(h.color||COLORS[0].color)+"77");}
    function dailyScores(h){const logs=h.logs||{}, keys=Object.keys(logs).sort(), start=keys.length?fromKey(keys[0]):addDays(today,-60), begin=start<addDays(today,-365)?start:addDays(today,-365), out={};let score=0;const target=Math.max(1,Number(h.dailyTarget)||50);for(let d=new Date(begin);d<=today;d=addDays(d,1)){const k=keyOf(d),v=Number(logs[k]||0);score=score*.952+Math.min(1,v/target)*.048;out[k]={ema:score*100,direct:Math.min(100,v/target*100),value:v};}return out;}
    function periodStart(d,p){if(p==="week")return monday(d);if(p==="month")return new Date(d.getFullYear(),d.getMonth(),1,12);if(p==="quarter")return new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1,12);if(p==="year")return new Date(d.getFullYear(),0,1,12);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);}
    function bucketList(h,p,offset){const logs=h.logs||{},scores=dailyScores(h),counts={day:13,week:10,month:12,quarter:8,year:7},span={day:1,week:7,month:1,quarter:3,year:1}[p],count=counts[p],out=[];let end=periodStart(today,p);if(p==="day")end=addDays(end,-offset*7);else if(p==="week")end=addDays(end,-offset*28);else if(p==="month")end=new Date(end.getFullYear(),end.getMonth()-offset*6,1,12);else if(p==="quarter")end=new Date(end.getFullYear(),end.getMonth()-offset*6,1,12);else end=new Date(end.getFullYear()-offset*3,0,1,12);
      for(let i=count-1;i>=0;i--){let start;if(p==="day")start=addDays(end,-i);else if(p==="week")start=addDays(end,-i*7);else if(p==="month")start=new Date(end.getFullYear(),end.getMonth()-i,1,12);else if(p==="quarter")start=new Date(end.getFullYear(),end.getMonth()-i*3,1,12);else start=new Date(end.getFullYear()-i,0,1,12);let finish=p==="day"?start:p==="week"?addDays(start,6):p==="month"?new Date(start.getFullYear(),start.getMonth()+1,0,12):p==="quarter"?new Date(start.getFullYear(),start.getMonth()+3,0,12):new Date(start.getFullYear(),11,31,12);if(finish>today)finish=today;let value=0,last=0;for(let d=new Date(start);d<=finish;d=addDays(d,1)){const k=keyOf(d);value+=Number(logs[k]||0);if(scores[k])last=scores[k].ema;}let days=p==="day"?1:p==="week"?7:p==="month"?new Date(start.getFullYear(),start.getMonth()+1,0).getDate():p==="quarter"?new Date(start.getFullYear(),start.getMonth()+3,0).getDate()+new Date(start.getFullYear(),start.getMonth()+2,0).getDate()+new Date(start.getFullYear(),start.getMonth()+1,0).getDate():365;let label=p==="day"?String(start.getDate()):p==="week"?`${MONTHS[start.getMonth()]} ${start.getDate()}`:p==="month"?MONTHS[start.getMonth()]:p==="quarter"?`Q${Math.floor(start.getMonth()/3)+1}`:String(start.getFullYear());out.push({start,key:keyOf(start),label,sub:(i===count-1||start.getMonth()===0)?String(start.getFullYear()).slice(-2):"",full:start.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}),value,ema:last,direct:Math.min(100,value/(Math.max(1,Number(h.dailyTarget)||50)*days)*100)});}return out;}

    function renderTargets(h){const logs=h.logs||{},sum=(s,e)=>{let n=0;for(let d=new Date(s);d<=e;d=addDays(d,1))n+=Number(logs[keyOf(d)]||0);return n;},weekStart=addDays(today,-6),monthStart=addDays(today,-29),quarterStart=addDays(today,-89),yearStart=new Date(today.getFullYear(),0,1,12),goal=Math.max(1,Number(h.dailyTarget)||50),rows=[["Today",logs[keyOf(today)]||0,goal],["Week",sum(weekStart,today),goal*7],["Month",sum(monthStart,today),goal*30],["Quarter",sum(quarterStart,today),goal*90],["Year",sum(yearStart,today),h.yearlyTarget||goal*365]];document.getElementById("targetsStack").innerHTML=rows.map(([label,value,target])=>{const pct=Math.min(100,value/target*100);return `<div class="target-row"><span class="target-label">${label}</span><div class="target-track" title="${label}: ${value} / ${target} (${pct.toFixed(0)}%)"><div class="target-fill ${pct>=99.9?"completed":""}" style="width:${Math.max(value?2.2:0,pct)}%"></div>${value>0&&pct>=14?`<span class="target-current">${shortNum(value)}</span>`:""}<span class="target-goal">${shortNum(target)}</span><span class="target-pct">${pct.toFixed(0)}%</span></div></div>`;}).join("");const s=dailyScores(h)[keyOf(today)]?.ema||0,total=Object.values(logs).reduce((a,v)=>a+Number(v||0),0),days=Object.values(logs).filter(v=>Number(v)>0).length;document.getElementById("kpiStrip").innerHTML=`<div class="kpi-box"><div class="kpi-val accent">${s.toFixed(1)}%</div><div class="kpi-lbl">Score</div></div><div class="kpi-box"><div class="kpi-val">${shortNum(rows[4][1])}</div><div class="kpi-lbl">This year</div></div><div class="kpi-box"><div class="kpi-val">${days}</div><div class="kpi-lbl">Active days</div></div><div class="kpi-box"><div class="kpi-val">${shortNum(total)}</div><div class="kpi-lbl">Total ${esc(h.unit)}</div></div>`;}

    function renderLineChart(h){const svg=document.getElementById("scoreSvg"),tip=document.getElementById("scoreTooltip"),b=bucketList(h,scorePeriod,scoreOffset),W=500,H=225,L=24,R=14,T=16,B=176,iw=W-L-R,ih=B-T,n=b.length,step=iw/n;document.getElementById("scoreNextBtn").disabled=scoreOffset<=0;let html="";[100,80,60,40,20,0].forEach(v=>{const y=B-v/100*ih;html+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" class="${v?"chart-grid-line":"chart-baseline"}"/>`;if(v)html+=`<text x="${L+2}" y="${y+4}" class="chart-label" text-anchor="start">${v}%</text>`;});const points=b.map((x,i)=>({x:L+step*i+step/2,y:B-Math.min(100,state.scoreMode==="ema"?x.ema:x.direct)/100*ih,...x}));const line=points.map((p,i)=>`${i?"L":"M"}${p.x},${p.y}`).join(" "),area=`${line} L${points.at(-1).x},${B} L${points[0].x},${B} Z`;html+=`<path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`;points.forEach((p,i)=>{html+=`<g class="score-dot" data-index="${i}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="10" fill="transparent"/><circle cx="${p.x}" cy="${p.y}" r="5" fill="var(--bg-surface)"/><circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--accent)"/><text x="${p.x}" y="${B+18}" class="chart-label">${p.label}</text>${p.sub?`<text x="${p.x}" y="${B+31}" class="chart-sublabel">${p.sub}</text>`:""}</g>`;});svg.innerHTML=html;svg.querySelectorAll(".score-dot").forEach(g=>{const p=points[Number(g.dataset.index)];g.onclick=()=>openLog(p.key);g.onmouseenter=()=>{tip.textContent=`${p.full}: ${p.value} ${h.unit} · ${(state.scoreMode==="ema"?p.ema:p.direct).toFixed(1)}%`;tip.style.left=`${p.x/W*100}%`;tip.style.top=`${p.y/H*100}%`;tip.classList.add("visible");};g.onmouseleave=()=>tip.classList.remove("visible");});}
    function renderBars(h){const svg=document.getElementById("historySvg"),tip=document.getElementById("historyTooltip"),b=bucketList(h,historyPeriod,historyOffset),W=500,H=215,L=20,R=14,T=20,B=165,iw=W-L-R,ih=B-T,max=Math.max(Number(h.dailyTarget)||50,...b.map(x=>x.value),10)*1.15,n=b.length,step=iw/n,bw=Math.min(22,step*.45);document.getElementById("historyNextBtn").disabled=historyOffset<=0;let html="";for(let i=0;i<=4;i++){const y=B-i/4*ih;html+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" class="${i?"chart-grid-line":"chart-baseline"}"/>`;}b.forEach((x,i)=>{const cx=L+step*i+step/2,bh=x.value?Math.max(4,x.value/max*ih):3,y=B-bh;html+=`<g class="history-bar" data-index="${i}" style="cursor:pointer"><rect x="${cx-step/2}" y="${T}" width="${step}" height="${ih}" fill="transparent"/><rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${x.value?"var(--accent)":"#ffffff22"}"/>${x.value?`<text x="${cx}" y="${y-4}" class="chart-label">${shortNum(x.value)}</text>`:""}<text x="${cx}" y="${B+18}" class="chart-label">${x.label}</text>${x.sub?`<text x="${cx}" y="${B+31}" class="chart-sublabel">${x.sub}</text>`:""}</g>`;});svg.innerHTML=html;svg.querySelectorAll(".history-bar").forEach(g=>{const x=b[Number(g.dataset.index)];g.onclick=()=>openLog(x.key);g.onmouseenter=e=>{tip.textContent=`${x.full}: ${x.value} ${h.unit}`;tip.style.left=`${e.offsetX/svg.clientWidth*100}%`;tip.style.top="15%";tip.classList.add("visible");};g.onmouseleave=()=>tip.classList.remove("visible");});}

    function renderCalendar(h){const grid=document.getElementById("calendarGrid"),first=new Date(calYear,calMonth,1),offset=(first.getDay()+6)%7,days=new Date(calYear,calMonth+1,0).getDate(),target=Number(h.dailyTarget)||50;document.getElementById("calMonthLabel").textContent=`${MONTHS[calMonth]} ${calYear}`;let html="";for(let i=0;i<offset;i++)html+='<div class="cal-day empty"></div>';for(let d=1;d<=days;d++){const k=keyOf(new Date(calYear,calMonth,d,12)),v=Number(h.logs[k]||0),cls=v>=target?"logged-full":v>0?"logged-partial":"",isToday=k===keyOf(today);html+=`<button class="cal-day ${cls} ${isToday?"today":""}" data-key="${k}"><span class="cal-day-num">${d}</span>${v?`<span class="cal-day-val">${shortNum(v)}</span>`:""}</button>`;}grid.innerHTML=html;grid.querySelectorAll("[data-key]").forEach(el=>el.onclick=()=>openLog(el.dataset.key));}
    function renderStreaks(h){const root=document.getElementById("streaksList"),keys=Object.keys(h.logs||{}).filter(k=>Number(h.logs[k])>0).sort();if(!keys.length){root.innerHTML='<span style="color:var(--text-secondary);font-size:12px">Log entries on consecutive days to build a streak.</span>';return;}const runs=[];let s=keys[0],e=s,n=1;for(let i=1;i<keys.length;i++){if(keyOf(addDays(fromKey(keys[i-1]),1))===keys[i]){e=keys[i];n++;}else{runs.push({s,e,n});s=e=keys[i];n=1;}}runs.push({s,e,n});const top=runs.sort((a,b)=>b.n-a.n).slice(0,4),max=Math.max(...top.map(x=>x.n));root.innerHTML=top.map(x=>`<div class="streak-item"><span>${fromKey(x.s).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span><div class="streak-bar-wrap"><div class="streak-bar-fill" style="width:${Math.max(18,x.n/max*100)}%"></div><span class="streak-bar-text">${x.n} ${x.n===1?"day":"days"}</span></div><span>${fromKey(x.e).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></div>`).join("");}
    function renderList(){const root=document.getElementById("habitsListContainer");root.innerHTML=state.habits.map(h=>{const v=Number(h.logs[keyOf(today)]||0);return `<button class="habit-item" data-id="${esc(h.id)}"><div class="habit-main"><div class="habit-ring" style="color:${h.color}">${shortNum(v)}</div><div class="habit-meta"><h3>${esc(h.name)}</h3><p>Target ${h.dailyTarget} ${esc(h.unit)} · ${v} today</p></div></div><span>›</span></button>`;}).join("");root.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{state.activeHabitId=el.dataset.id;save();switchView("detail");});}
    function render(){const h=active();if(!h)return;applyColor(h);document.getElementById("topTitle").textContent=currentView==="detail"?h.name:"All Habits";document.getElementById("topSubtitle").textContent=currentView==="detail"?`Target: ${h.dailyTarget} ${h.unit} / day`:`${state.habits.length} tracked habits`;document.getElementById("quickLogBtn").style.display=currentView==="detail"?"":"none";document.getElementById("editHabitBtn").style.display=currentView==="detail"?"":"none";if(currentView==="detail"){renderTargets(h);renderLineChart(h);renderBars(h);renderCalendar(h);renderStreaks(h);}else renderList();}
    function switchView(v){currentView=v;document.getElementById("detailView").classList.toggle("active",v==="detail");document.getElementById("listView").classList.toggle("active",v==="list");render();}

    function openLog(k){editingDate=k;const h=active(),input=document.getElementById("logValueInput");document.getElementById("logModalTitle").textContent=`Log ${h.name}`;document.getElementById("logModalDateSub").textContent=fromKey(k).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});input.value=h.logs[k]??"";const t=Number(h.dailyTarget)||50;document.getElementById("logPresetChips").innerHTML=[.5,.6,1,1.5].map(x=>`<button class="btn btn-ghost" data-value="${Math.round(t*x)}">${Math.round(t*x)}</button>`).join("");document.querySelectorAll("#logPresetChips [data-value]").forEach(b=>b.onclick=()=>input.value=b.dataset.value);document.getElementById("logModal").classList.add("open");}
    function closeLog(){document.getElementById("logModal").classList.remove("open");editingDate=null;}
    function openHabit(isNew){creating=isNew;const h=active();document.getElementById("habitModalHeader").textContent=isNew?"Create new habit":"Edit habit";document.getElementById("habitNameInput").value=isNew?"":h.name;document.getElementById("habitTargetInput").value=isNew?50:h.dailyTarget;document.getElementById("habitUnitInput").value=isNew?"reps":h.unit;selectedColor=isNew?COLORS[1]:(COLORS.find(c=>c.color===h.color)||COLORS[0]);document.getElementById("colorSwatches").innerHTML=COLORS.map((c,i)=>`<button class="color-swatch ${c===selectedColor?"selected":""}" data-index="${i}" title="${c.name}" style="background:${c.color}"></button>`).join("");document.querySelectorAll("#colorSwatches [data-index]").forEach(b=>b.onclick=()=>{selectedColor=COLORS[Number(b.dataset.index)];document.querySelectorAll("#colorSwatches .color-swatch").forEach(x=>x.classList.toggle("selected",x===b));});document.getElementById("habitDeleteBtn").style.display=isNew?"none":"";document.getElementById("habitModal").classList.add("open");}
    function exportBackup(){const text=JSON.stringify(state,null,2),name="tracker-backup.json";if(window.TallyAndroid){window.TallyAndroid.saveBackup(text,name);return;}const a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
    function importBackup(file){const r=new FileReader();r.onload=e=>{try{const data=JSON.parse(e.target.result);if(!Array.isArray(data.habits))throw Error();state=data;save();render();}catch(err){alert("Invalid backup JSON file.");}};r.readAsText(file);}

    document.getElementById("backBtn").onclick=()=>switchView(currentView==="detail"?"list":"detail");document.getElementById("quickLogBtn").onclick=()=>openLog(keyOf(today));document.getElementById("editHabitBtn").onclick=()=>openHabit(false);document.getElementById("createHabitFromListBtn").onclick=()=>openHabit(true);document.getElementById("menuNewHabit").onclick=()=>openHabit(true);document.getElementById("menuBtn").onclick=e=>{e.stopPropagation();document.getElementById("dropdownMenu").classList.toggle("open");};document.addEventListener("click",()=>document.getElementById("dropdownMenu").classList.remove("open"));
    document.getElementById("menuLoadSample").onclick=()=>{localStorage.removeItem(DATA_KEY);state=defaultState();scoreOffset=historyOffset=0;save();render();};document.getElementById("menuExport").onclick=exportBackup;document.getElementById("menuImport").onclick=()=>document.getElementById("importFileInput").click();document.getElementById("importFileInput").onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value="";};
    document.getElementById("scorePeriodSelect").onchange=e=>{scorePeriod=e.target.value;scoreOffset=0;renderLineChart(active());};document.getElementById("historyPeriodSelect").onchange=e=>{historyPeriod=e.target.value;historyOffset=0;renderBars(active());};document.getElementById("scorePrevBtn").onclick=()=>{scoreOffset++;renderLineChart(active());};document.getElementById("scoreNextBtn").onclick=()=>{if(scoreOffset){scoreOffset--;renderLineChart(active());}};document.getElementById("historyPrevBtn").onclick=()=>{historyOffset++;renderBars(active());};document.getElementById("historyNextBtn").onclick=()=>{if(historyOffset){historyOffset--;renderBars(active());}};
    document.querySelectorAll("#scoreModeToggle [data-mode]").forEach(b=>b.onclick=()=>{state.scoreMode=b.dataset.mode;document.querySelectorAll("#scoreModeToggle .seg-btn").forEach(x=>x.classList.toggle("active",x===b));save();renderLineChart(active());});document.getElementById("calPrevBtn").onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar(active());};document.getElementById("calNextBtn").onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar(active());};
    document.getElementById("logCancelBtn").onclick=closeLog;document.getElementById("logClearBtn").onclick=()=>{if(editingDate)delete active().logs[editingDate];save();closeLog();render();};document.getElementById("logSaveBtn").onclick=()=>{const v=parseFloat(document.getElementById("logValueInput").value);if(editingDate){if(!Number.isFinite(v)||v<=0)delete active().logs[editingDate];else active().logs[editingDate]=v;}save();closeLog();render();};
    document.getElementById("habitCancelBtn").onclick=()=>document.getElementById("habitModal").classList.remove("open");document.getElementById("habitSaveBtn").onclick=()=>{const name=document.getElementById("habitNameInput").value.trim()||"Untitled Habit",dailyTarget=Math.max(1,parseFloat(document.getElementById("habitTargetInput").value)||50),unit=document.getElementById("habitUnitInput").value.trim()||"reps";if(creating){const id="habit-"+Date.now();state.habits.push({id,name,dailyTarget,yearlyTarget:dailyTarget*365,unit,color:selectedColor.color,colorStrong:selectedColor.strong,logs:{}});state.activeHabitId=id;switchView("detail");}else{const h=active();Object.assign(h,{name,dailyTarget,yearlyTarget:dailyTarget*365,unit,color:selectedColor.color,colorStrong:selectedColor.strong});}save();document.getElementById("habitModal").classList.remove("open");render();};document.getElementById("habitDeleteBtn").onclick=()=>{if(state.habits.length<2){alert("Keep at least one habit.");return;}state.habits=state.habits.filter(h=>h.id!==state.activeHabitId);state.activeHabitId=state.habits[0].id;save();document.getElementById("habitModal").classList.remove("open");render();};
    document.getElementById("logModal").addEventListener("click",e=>{if(e.target.id==="logModal")closeLog();});document.getElementById("habitModal").addEventListener("click",e=>{if(e.target.id==="habitModal")document.getElementById("habitModal").classList.remove("open");});
    document.getElementById("scorePeriodSelect").value=scorePeriod;document.getElementById("historyPeriodSelect").value=historyPeriod;save();render();
  </script>
