<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tally — Habit Tracker</title>
<meta name="description" content="A quiet ledger for the things you do daily." />
<meta name="theme-color" content="#14171C" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tally" />

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: contain; }
  body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  #root { min-height: 100vh; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 0px 0px var(--glow-color); }
    50% { box-shadow: 0 0 14px 2px var(--glow-color); }
  }
  .day-lit { animation: glowPulse 2.4s ease-in-out infinite; }
  .tap { transition: filter .15s ease, opacity .15s ease, background-color .15s ease, border-color .15s ease; }
  .tap:hover { filter: brightness(1.15); }
  .tap:active { filter: brightness(0.92); }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ---------- palette ---------- */
const CATEGORY_COLORS = [
  { name: "Coral", hex: "#FF6B6B" },
  { name: "Amber", hex: "#F2A93B" },
  { name: "Sunflower", hex: "#FFD166" },
  { name: "Mint", hex: "#06D6A0" },
  { name: "Sky", hex: "#4D96FF" },
  { name: "Violet", hex: "#9B72CF" },
  { name: "Rose", hex: "#EF476F" },
  { name: "Lime", hex: "#A9D82D" },
];

const DARK = { bg:"#14171C", surface:"#1B1F27", surface2:"#232833", border:"#2A2F3A", text:"#ECEAE3", muted:"#8B8F98", faint:"#565C68" };
const LIGHT = { bg:"#F6F4EF", surface:"#FFFFFF", surface2:"#F0EDE5", border:"#E4E0D5", text:"#20242B", muted:"#6B7280", faint:"#9A9488" };

const DATA_KEY = "tally-data-v1";
const THEME_KEY = "tally-theme-v1";

/* ---------- date helpers ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayKey(){ return dateKey(new Date()); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function sameDay(a,b){ return dateKey(a)===dateKey(b); }
function monthLabel(d){ return d.toLocaleDateString(undefined,{month:"long",year:"numeric"}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function goalMet(value, goal){ if(value==null) return false; return goal>0 ? value>=goal : value>0; }

function buildMonthGrid(viewDate){
  const year=viewDate.getFullYear(), month=viewDate.getMonth();
  const first=new Date(year,month,1);
  const startOffset=first.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,month,d));
  while(cells.length%7!==0) cells.push(null);
  return cells;
}

function longestStreakEver(entries, goal){
  const keys = Object.keys(entries);
  if(!keys.length) return 0;
  const dates = keys.map(parseKey).sort((a,b)=>a-b);
  let cursor = new Date(dates[0]);
  const end = new Date();
  let longest=0, current=0;
  while(cursor<=end){
    const k = dateKey(cursor);
    if(goalMet(entries[k], goal)){ current+=1; longest=Math.max(longest,current); } else { current=0; }
    cursor = addDays(cursor,1);
  }
  return longest;
}

function computeStreak(entries, goal){
  let streak=0, cursor=new Date();
  if(!goalMet(entries[dateKey(cursor)], goal)) cursor=addDays(cursor,-1);
  while(goalMet(entries[dateKey(cursor)], goal)){ streak+=1; cursor=addDays(cursor,-1); }
  return streak;
}

function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { habits: [], entries: {} };
}
function saveData(habits, entries){
  try{ localStorage.setItem(DATA_KEY, JSON.stringify({habits, entries})); return true; }
  catch(e){ return false; }
}

/* ---------- icons (inline, dependency-free) ---------- */
function Icon({ name, size=16, color="currentColor", strokeWidth=2 }){
  const p = { width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:color, strokeWidth, strokeLinecap:"round", strokeLinejoin:"round" };
  switch(name){
    case "plus": return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case "minus": return <svg {...p}><path d="M5 12h14"/></svg>;
    case "x": return <svg {...p}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case "check": return <svg {...p}><path d="M20 6 9 17l-5-5"/></svg>;
    case "chevron-left": return <svg {...p}><path d="M15 18l-6-6 6-6"/></svg>;
    case "chevron-right": return <svg {...p}><path d="M9 18l6-6-6-6"/></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>;
    case "flame": return <svg {...p}><path d="M12 2.5c1.2 3.4-3 4.8-3 8.3a3 3 0 006 0c0-1.2-.5-2-1.3-2.8.9 2.3-1 3.2-1 3.2 0-2.4 1.6-4.4 0-8.7z"/><path d="M8.5 12.5A4.5 4.5 0 0012 19a4.5 4.5 0 004.2-6.1"/></svg>;
    case "calendar": return <svg {...p}><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>;
    case "bar-chart": return <svg {...p}><path d="M4 20V11M10 20V4M16 20v-6"/><path d="M2 20h20"/></svg>;
    case "line-chart": return <svg {...p}><path d="M3 3v18h18"/><path d="M6 16l4-5 4 3 5-7"/></svg>;
    case "grid": return <svg {...p}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>;
    case "trending-up": return <svg {...p}><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>;
    case "target": return <svg {...p}><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5" fill={color}/></svg>;
    case "activity": return <svg {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>;
    case "upload": return <svg {...p}><path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "moon": return <svg {...p}><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>;
    case "star": return <svg {...p} fill={color} stroke="none"><path d="M12 2l2.9 6.5 7.1.7-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.7z"/></svg>;
    case "sparkles": return <svg {...p}><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>;
    default: return null;
  }
}

/* ---------- tiny SVG charts (no external chart lib) ---------- */
function BarChartSVG({ data, goal, color, height=220 }){
  const W = 600, H = height, padL = 30, padR = 12, padT = 16, padB = 24;
  const max = Math.max(1, goal||0, ...data.map(d=>d.value)) * 1.15;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = data.length;
  const bw = Math.max(2, (innerW / n) * 0.55);
  const step = innerW / n;
  const y = (v) => padT + innerH - (v/max)*innerH;
  const goalY = goal>0 ? y(goal) : null;
  const labelEvery = Math.max(1, Math.ceil(n/7));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height, display:"block"}} preserveAspectRatio="none">
      {[0.25,0.5,0.75,1].map((f,i)=>(
        <line key={i} x1={padL} x2={W-padR} y1={padT+innerH*(1-f)} y2={padT+innerH*(1-f)} stroke="currentColor" strokeOpacity="0.08" />
      ))}
      {goalY!=null && (
        <line x1={padL} x2={W-padR} y1={goalY} y2={goalY} stroke={color} strokeOpacity="0.55" strokeDasharray="4 4" />
      )}
      {data.map((d,i)=>{
        const x = padL + i*step + (step-bw)/2;
        const barH = padT+innerH - y(d.value);
        const met = goalMet(d.value, goal);
        return (
          <g key={i}>
            <rect x={x} y={y(d.value)} width={bw} height={Math.max(0,barH)} rx="2.5" fill={color} opacity={met?1:0.55}>
              <title>{d.label}: {d.value}</title>
            </rect>
          </g>
        );
      })}
      {data.map((d,i)=> i%labelEvery===0 ? (
        <text key={i} x={padL+i*step+step/2} y={H-6} fontSize="9" fill="currentColor" opacity="0.5" textAnchor="middle" fontFamily="JetBrains Mono, monospace">{d.label}</text>
      ) : null)}
    </svg>
  );
}

function AreaChartSVG({ data, goal, color, height=220 }){
  const W = 600, H = height, padL = 30, padR = 12, padT = 16, padB = 24;
  const max = Math.max(1, goal||0, ...data.map(d=>d.value)) * 1.15;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = data.length;
  const step = n>1 ? innerW/(n-1) : innerW;
  const y = (v) => padT + innerH - (v/max)*innerH;
  const pts = data.map((d,i)=>[padL+i*step, y(d.value)]);
  const linePath = pts.map((p,i)=> (i===0?"M":"L")+p[0]+","+p[1]).join(" ");
  const areaPath = linePath + ` L${padL+innerW},${padT+innerH} L${padL},${padT+innerH} Z`;
  const goalY = goal>0 ? y(goal) : null;
  const labelEvery = Math.max(1, Math.ceil(n/7));
  const gid = "grad-"+color.replace("#","");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height, display:"block"}} preserveAspectRatio="none">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.45" />
          <stop offset="100%" stopColor={color} stopOpacity="0.02" />
        </linearGradient>
      </defs>
      {[0.25,0.5,0.75,1].map((f,i)=>(
        <line key={i} x1={padL} x2={W-padR} y1={padT+innerH*(1-f)} y2={padT+innerH*(1-f)} stroke="currentColor" strokeOpacity="0.08" />
      ))}
      {goalY!=null && <line x1={padL} x2={W-padR} y1={goalY} y2={goalY} stroke={color} strokeOpacity="0.55" strokeDasharray="4 4" />}
      <path d={areaPath} fill={`url(#${gid})`} stroke="none" />
      <path d={linePath} fill="none" stroke={color} strokeWidth="2.25" strokeLinejoin="round" strokeLinecap="round" />
      {pts.map((p,i)=>(
        <circle key={i} cx={p[0]} cy={p[1]} r="2.2" fill={color}><title>{data[i].label}: {data[i].value}</title></circle>
      ))}
      {data.map((d,i)=> i%labelEvery===0 ? (
        <text key={i} x={padL+i*step} y={H-6} fontSize="9" fill="currentColor" opacity="0.5" textAnchor="middle" fontFamily="JetBrains Mono, monospace">{d.label}</text>
      ) : null)}
    </svg>
  );
}

function StackedBarSVG({ data, habits, height=240 }){
  const W = 600, H = height, padL = 30, padR = 12, padT = 12, padB = 24;
  const totals = data.map(row => habits.reduce((s,h)=>s+(row[h.id]||0),0));
  const max = Math.max(1, ...totals) * 1.15;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = data.length;
  const bw = Math.max(2,(innerW/n)*0.55);
  const step = innerW/n;
  const labelEvery = Math.max(1, Math.ceil(n/7));
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%", height, display:"block"}} preserveAspectRatio="none">
      {[0.25,0.5,0.75,1].map((f,i)=>(
        <line key={i} x1={padL} x2={W-padR} y1={padT+innerH*(1-f)} y2={padT+innerH*(1-f)} stroke="currentColor" strokeOpacity="0.08" />
      ))}
      {data.map((row,i)=>{
        const x = padL + i*step + (step-bw)/2;
        let yCursor = padT+innerH;
        return (
          <g key={i}>
            {habits.map(h=>{
              const v = row[h.id]||0;
              if(v<=0) return null;
              const segH = (v/max)*innerH;
              yCursor -= segH;
              return <rect key={h.id} x={x} y={yCursor} width={bw} height={segH} fill={h.color}><title>{h.name}: {v}</title></rect>;
            })}
          </g>
        );
      })}
      {data.map((d,i)=> i%labelEvery===0 ? (
        <text key={i} x={padL+i*step+step/2} y={H-6} fontSize="9" fill="currentColor" opacity="0.5" textAnchor="middle" fontFamily="JetBrains Mono, monospace">{d.label}</text>
      ) : null)}
    </svg>
  );
}

/* ---------- small UI atoms ---------- */
function ToggleBtn({active, onClick, icon, label, C}){
  return (
    <button onClick={onClick} className="tap" style={{
      display:"flex", alignItems:"center", gap:6, padding:"6px 12px", borderRadius:8,
      fontSize:12, fontWeight:500,
      background: active? C.surface2 : "transparent",
      border: `1px solid ${active? C.border : "transparent"}`,
      color: active? C.text : C.muted,
    }}>{icon}{label}</button>
  );
}
function IconToggle({active, onClick, icon, C}){
  return (
    <button onClick={onClick} className="tap" style={{padding:6, borderRadius:6, background: active? C.surface: "transparent", color: active? C.text : C.faint, border:"none"}}>{icon}</button>
  );
}
function StatChip({icon, label, value, C}){
  return (
    <div style={{display:"flex", alignItems:"center", gap:8, padding:"8px 12px", borderRadius:10, background:C.surface2, border:`1px solid ${C.border}`}}>
      <span style={{color:C.faint}}>{icon}</span>
      <div>
        <div style={{color:C.faint, fontSize:9, fontFamily:"JetBrains Mono, monospace", textTransform:"uppercase", letterSpacing:"0.05em", lineHeight:1, marginBottom:3}}>{label}</div>
        <div style={{fontFamily:"JetBrains Mono, monospace", fontSize:14, lineHeight:1}}>{value}</div>
      </div>
    </div>
  );
}

/* ---------- main app ---------- */
function App(){
  const [theme, setTheme] = useState(() => localStorage.getItem(THEME_KEY) || "dark");
  const C = theme === "dark" ? DARK : LIGHT;

  const [habits, setHabits] = useState([]);
  const [entries, setEntries] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [view, setView] = useState("calendar");
  const [chartType, setChartType] = useState("bar");
  const [chartRange, setChartRange] = useState(30);
  const [calMonth, setCalMonth] = useState(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
  const [showAdd, setShowAdd] = useState(false);
  const [editing, setEditing] = useState(null);
  const [inputVal, setInputVal] = useState("");
  const [toast, setToast] = useState(null);
  const fileInputRef = React.useRef(null);

  useEffect(() => {
    const data = loadData();
    setHabits(data.habits || []);
    setEntries(data.entries || {});
    if (data.habits && data.habits.length) setSelectedId(data.habits[0].id);
    setLoaded(true);
  }, []);

  useEffect(() => { if(loaded) saveData(habits, entries); }, [habits, entries, loaded]);
  useEffect(() => { localStorage.setItem(THEME_KEY, theme); }, [theme]);
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2400);
    return () => clearTimeout(t);
  }, [toast]);

  const selectedHabit = habits.find(h => h.id === selectedId) || null;
  const selectedEntries = selectedId ? (entries[selectedId] || {}) : {};

  useEffect(() => {
    if (selectedHabit) setInputVal(String(selectedEntries[todayKey()] ?? ""));
    // eslint-disable-next-line
  }, [selectedId]);

  function addHabit(h){
    const next = [...habits, {id: uid(), ...h}];
    setHabits(next);
    setSelectedId(next[next.length-1].id);
    setShowAdd(false);
    setToast("Habit created");
  }
  function updateHabit(id, patch){
    setHabits(habits.map(h => h.id===id ? {...h, ...patch} : h));
    setEditing(null);
    setToast("Saved");
  }
  function deleteHabit(id){
    const next = habits.filter(h => h.id !== id);
    setHabits(next);
    const nextEntries = {...entries};
    delete nextEntries[id];
    setEntries(nextEntries);
    if (selectedId === id) setSelectedId(next.length ? next[0].id : null);
    setToast("Habit deleted");
  }
  function setEntryValue(habitId, key, value){
    setEntries(prev => {
      const he = {...(prev[habitId]||{})};
      if (value===null || value==="" || Number.isNaN(value)) delete he[key];
      else he[key] = value;
      return {...prev, [habitId]: he};
    });
  }
  function commitTodayValue(){
    if (!selectedHabit) return;
    const num = inputVal==="" ? null : Number(inputVal);
    setEntryValue(selectedHabit.id, todayKey(), num);
  }
  function bump(delta){
    const current = Number(inputVal) || 0;
    const next = Math.max(0, current+delta);
    setInputVal(String(next));
    if (selectedHabit) setEntryValue(selectedHabit.id, todayKey(), next);
  }

  function exportData(){
    const data = JSON.stringify({habits, entries}, null, 2);
    const filename = `tally-backup-${todayKey()}.json`;
    if (window.TallyAndroid) {
      window.TallyAndroid.saveBackup(data, filename);
      setToast("Choose where to save your backup");
      return;
    }
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
    setToast("Backup downloaded");
  }
  function importData(file){
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const parsed = JSON.parse(e.target.result);
        if (!parsed.habits || !parsed.entries) throw new Error("bad format");
        setHabits(parsed.habits);
        setEntries(parsed.entries);
        setSelectedId(parsed.habits.length ? parsed.habits[0].id : null);
        setToast("Backup restored");
      }catch(err){ setToast("Couldn't read that file"); }
    };
    reader.readAsText(file);
  }

  const streak = selectedHabit ? computeStreak(selectedEntries, selectedHabit.goal) : 0;

  const rangeData = useMemo(() => {
    const out = [];
    for (let i = chartRange-1; i >= 0; i--) {
      const d = addDays(new Date(), -i);
      const key = dateKey(d);
      out.push({ label: d.toLocaleDateString(undefined, {month:"short", day:"numeric"}), value: selectedEntries[key] ?? 0 });
    }
    return out;
  }, [selectedEntries, chartRange]);

  const rangeStats = useMemo(() => {
    const logged = rangeData.filter(d => d.value > 0);
    const total = rangeData.reduce((s,d)=>s+d.value,0);
    const best = rangeData.reduce((m,d)=>Math.max(m,d.value),0);
    const avg = logged.length ? total/logged.length : 0;
    const metCount = selectedHabit ? rangeData.filter(d => goalMet(d.value, selectedHabit.goal)).length : 0;
    return {total, best, avg, metCount};
  }, [rangeData, selectedHabit]);

  const overview14 = useMemo(() => {
    const out = [];
    for (let i=13;i>=0;i--){
      const d = addDays(new Date(), -i);
      const key = dateKey(d);
      const row = { label: d.toLocaleDateString(undefined,{weekday:"short"}) };
      habits.forEach(h => { row[h.id] = (entries[h.id]||{})[key] ?? 0; });
      out.push(row);
    }
    return out;
  }, [habits, entries]);

  const insights = useMemo(() => {
    return habits.map(h => {
      const he = entries[h.id] || {};
      const last30 = [];
      for (let i=29;i>=0;i--) last30.push(he[dateKey(addDays(new Date(),-i))]);
      const met = last30.filter(v => goalMet(v, h.goal)).length;
      return {
        habit: h,
        completion: Math.round((met/30)*100),
        longest: longestStreakEver(he, h.goal),
        current: computeStreak(he, h.goal),
      };
    }).sort((a,b) => b.completion - a.completion);
  }, [habits, entries]);

  const grid = useMemo(() => buildMonthGrid(calMonth), [calMonth]);

  if (!loaded) {
    return <div style={{background:C.bg,color:C.muted,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>Loading your ledger…</div>;
  }

  return (
    <div style={{background:C.bg, color:C.text, minHeight:"100vh", transition:"background .2s ease, color .2s ease"}}>
      <div style={{maxWidth:960, margin:"0 auto", padding:"24px 16px 48px"}}>
        <div style={{display:"flex", alignItems:"flex-start", justifyContent:"space-between", marginBottom:28, flexWrap:"wrap", gap:12}}>
          <div>
            <h1 className="font-display" style={{fontSize:32, letterSpacing:"-0.01em", margin:0}}>Tally</h1>
            <p style={{color:C.muted, fontSize:13, margin:"4px 0 0"}}>A quiet ledger for the things you do daily.</p>
          </div>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <button onClick={()=>setTheme(theme==="dark"?"light":"dark")} className="tap" title="Toggle theme"
              style={{background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:8, color:C.text}}>
              <Icon name={theme==="dark"?"sun":"moon"} size={15}/>
            </button>
            <button onClick={exportData} className="tap" title="Backup data"
              style={{background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", color:C.text, display:"flex", alignItems:"center", gap:6, fontSize:12}}>
              <Icon name="download" size={14}/> Backup
            </button>
            <button onClick={()=>fileInputRef.current && fileInputRef.current.click()} className="tap" title="Restore data"
              style={{background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 10px", color:C.text, display:"flex", alignItems:"center", gap:6, fontSize:12}}>
              <Icon name="upload" size={14}/> Restore
            </button>
            <input ref={fileInputRef} type="file" accept="application/json" style={{display:"none"}}
              onChange={(e)=> e.target.files[0] && importData(e.target.files[0])} />
            <button onClick={()=>setShowAdd(true)} className="tap"
              style={{background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 14px", color:C.text, display:"flex", alignItems:"center", gap:6, fontSize:13, fontWeight:500}}>
              <Icon name="plus" size={15}/> New habit
            </button>
          </div>
        </div>

        {habits.length === 0 ? (
          <div style={{background:C.surface, border:`1px dashed ${C.border}`, borderRadius:14, padding:48, textAlign:"center"}}>
            <p className="font-display" style={{fontSize:20, marginBottom:8}}>No habits yet</p>
            <p style={{color:C.muted, fontSize:13, marginBottom:20}}>Add your first one — give it a color, a unit, and a daily goal.</p>
            <button onClick={()=>setShowAdd(true)} className="tap" style={{background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 18px", color:C.text, display:"inline-flex", gap:8, alignItems:"center", fontSize:13, fontWeight:500}}>
              <Icon name="plus" size={15}/> Add a habit
            </button>
          </div>
        ) : (
          <div style={{display:"grid", gridTemplateColumns: window.innerWidth < 760 ? "1fr" : "220px 1fr", gap:20}}>
            {/* sidebar */}
            <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:12, height:"fit-content"}}>
              <div style={{color:C.faint, fontSize:11, fontFamily:"JetBrains Mono, monospace", textTransform:"uppercase", letterSpacing:"0.06em", padding:"0 8px 8px"}}>Habits</div>
              <div style={{display:"flex", flexDirection:"column", gap:2}}>
                {habits.map(h => {
                  const met = goalMet((entries[h.id]||{})[todayKey()], h.goal);
                  return (
                    <button key={h.id} onClick={()=>setSelectedId(h.id)} className="tap" style={{
                      display:"flex", alignItems:"center", gap:8, padding:"8px 8px", borderRadius:8, textAlign:"left", fontSize:13,
                      background: selectedId===h.id? C.surface2 : "transparent",
                      border: selectedId===h.id? `1px solid ${C.border}` : "1px solid transparent",
                      color: C.text,
                    }}>
                      <span style={{width:10, height:10, borderRadius:"50%", flexShrink:0, background:h.color, boxShadow: met? `0 0 8px 1px ${h.color}`:"none"}} />
                      <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1}}>{h.name}</span>
                      {met && <Icon name="check" size={13} color={h.color}/>}
                    </button>
                  );
                })}
              </div>
              <div style={{borderTop:`1px solid ${C.border}`, marginTop:10, paddingTop:10}}>
                <ToggleBtn active={view==="insights"} onClick={()=>setView("insights")} icon={<Icon name="sparkles" size={14}/>} label="Insights" C={C} />
              </div>
            </div>

            {/* main */}
            <div style={{display:"flex", flexDirection:"column", gap:18, minWidth:0}}>
              {view === "insights" ? (
                <InsightsPanel insights={insights} C={C} onSelect={(id)=>{setSelectedId(id); setView("calendar");}} />
              ) : selectedHabit && (
                <React.Fragment>
                  <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:20}} className="fade-in">
                    <div style={{display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12, flexWrap:"wrap"}}>
                      <div style={{display:"flex", alignItems:"center", gap:12}}>
                        <span style={{width:14, height:14, borderRadius:"50%", background:selectedHabit.color}} />
                        <div>
                          <h2 className="font-display" style={{fontSize:22, margin:0}}>{selectedHabit.name}</h2>
                          <p style={{color:C.muted, fontSize:12, margin:"2px 0 0"}}>
                            Goal: {selectedHabit.goal>0 ? `${selectedHabit.goal} ${selectedHabit.unit||""}`.trim() : "log any amount"}
                          </p>
                        </div>
                      </div>
                      <div style={{display:"flex", alignItems:"center", gap:8}}>
                        <div style={{display:"flex", alignItems:"center", gap:6, padding:"6px 12px", borderRadius:8, background:C.surface2}}>
                          <Icon name="flame" size={15} color={streak>0? "#F2A93B" : C.faint}/>
                          <span className="font-mono" style={{fontSize:13}}>{streak} day{streak===1?"":"s"}</span>
                        </div>
                        <button onClick={()=>setEditing(selectedHabit)} className="tap" style={{color:C.muted, fontSize:12, background:"none", border:"none", padding:"6px 8px"}}>Edit</button>
                        <button onClick={()=>deleteHabit(selectedHabit.id)} className="tap" style={{color:C.muted, background:"none", border:"none", padding:6}}>
                          <Icon name="trash" size={15}/>
                        </button>
                      </div>
                    </div>

                    <div style={{marginTop:18, display:"flex", alignItems:"center", gap:12, flexWrap:"wrap"}}>
                      <span style={{color:C.muted, fontSize:11, fontFamily:"JetBrains Mono, monospace"}}>TODAY</span>
                      <div style={{display:"flex", alignItems:"center", gap:6}}>
                        <button onClick={()=>bump(-1)} className="tap" style={{width:32,height:32,borderRadius:8,background:C.surface2,border:`1px solid ${C.border}`,color:C.text,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="minus" size={14}/></button>
                        <input type="number" value={inputVal} onChange={e=>setInputVal(e.target.value)} onBlur={commitTodayValue} placeholder="0"
                          style={{background:C.surface2, border:`1px solid ${C.border}`, color:C.text, width:90, textAlign:"center", borderRadius:8, padding:"6px 8px", fontSize:14}} className="font-mono" />
                        <button onClick={()=>bump(1)} className="tap" style={{width:32,height:32,borderRadius:8,background:C.surface2,border:`1px solid ${C.border}`,color:C.text,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="plus" size={14}/></button>
                        {selectedHabit.unit && <span style={{color:C.muted, fontSize:12}}>{selectedHabit.unit}</span>}
                      </div>
                      {goalMet(Number(inputVal)||0, selectedHabit.goal) && (
                        <span style={{color:selectedHabit.color, fontSize:12, fontWeight:600, display:"flex", alignItems:"center", gap:4}}><Icon name="check" size={13}/> Goal reached</span>
                      )}
                    </div>
                  </div>

                  <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                    <ToggleBtn active={view==="calendar"} onClick={()=>setView("calendar")} icon={<Icon name="calendar" size={14}/>} label="Calendar" C={C} />
                    <ToggleBtn active={view==="chart"} onClick={()=>setView("chart")} icon={<Icon name="bar-chart" size={14}/>} label="Chart" C={C} />
                    <ToggleBtn active={view==="overview"} onClick={()=>setView("overview")} icon={<Icon name="grid" size={14}/>} label="All habits" C={C} />
                  </div>

                  {view === "calendar" && (
                    <CalendarView calMonth={calMonth} setCalMonth={setCalMonth} grid={grid} habit={selectedHabit} habitEntries={selectedEntries}
                      onSetValue={(key,val)=>setEntryValue(selectedHabit.id,key,val)} C={C} />
                  )}

                  {view === "chart" && (
                    <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:20}} className="fade-in">
                      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14, flexWrap:"wrap", gap:10}}>
                        <div>
                          <span style={{fontSize:13, fontWeight:500}}>Last {chartRange} days</span>
                          <span style={{color:C.faint, fontSize:11, fontFamily:"JetBrains Mono, monospace", display:"block"}}>{rangeStats.metCount} of {chartRange} days at goal</span>
                        </div>
                        <div style={{display:"flex", gap:10, alignItems:"center"}}>
                          <div style={{display:"flex", gap:2, background:C.surface2, border:`1px solid ${C.border}`, borderRadius:8, padding:2}}>
                            {[7,30,90].map(r => (
                              <button key={r} onClick={()=>setChartRange(r)} className="tap" style={{
                                padding:"4px 9px", borderRadius:6, fontSize:11, fontFamily:"JetBrains Mono, monospace",
                                background: chartRange===r ? C.surface : "transparent", color: chartRange===r? C.text : C.faint, border:"none"
                              }}>{r}d</button>
                            ))}
                          </div>
                          <div style={{display:"flex", gap:2, background:C.surface2, borderRadius:8, padding:2}}>
                            <IconToggle active={chartType==="bar"} onClick={()=>setChartType("bar")} icon={<Icon name="bar-chart" size={14}/>} C={C}/>
                            <IconToggle active={chartType==="line"} onClick={()=>setChartType("line")} icon={<Icon name="line-chart" size={14}/>} C={C}/>
                          </div>
                        </div>
                      </div>

                      <div style={{display:"flex", gap:8, marginBottom:16, flexWrap:"wrap"}}>
                        <StatChip icon={<Icon name="activity" size={13}/>} label="Average" value={`${rangeStats.avg.toFixed(1)}${selectedHabit.unit?` ${selectedHabit.unit}`:""}`} C={C}/>
                        <StatChip icon={<Icon name="trending-up" size={13}/>} label="Best day" value={`${rangeStats.best}${selectedHabit.unit?` ${selectedHabit.unit}`:""}`} C={C}/>
                        <StatChip icon={<Icon name="target" size={13}/>} label="Total" value={rangeStats.total} C={C}/>
                      </div>

                      <div style={{color:C.text}}>
                        {chartType==="bar"
                          ? <BarChartSVG data={rangeData} goal={selectedHabit.goal} color={selectedHabit.color} />
                          : <AreaChartSVG data={rangeData} goal={selectedHabit.goal} color={selectedHabit.color} />}
                      </div>
                    </div>
                  )}

                  {view === "overview" && (
                    <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:20}} className="fade-in">
                      <div style={{fontSize:13, fontWeight:500, marginBottom:14}}>Last 14 days · all habits</div>
                      <div style={{color:C.text}}>
                        <StackedBarSVG data={overview14} habits={habits} />
                      </div>
                      <div style={{display:"flex", gap:14, flexWrap:"wrap", marginTop:14}}>
                        {habits.map(h=>(
                          <div key={h.id} style={{display:"flex", alignItems:"center", gap:6, fontSize:11, color:C.muted}}>
                            <span style={{width:8,height:8,borderRadius:"50%",background:h.color}} />{h.name}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </React.Fragment>
              )}
            </div>
          </div>
        )}
      </div>

      {(showAdd || editing) && (
        <HabitModal initial={editing} C={C} onClose={()=>{setShowAdd(false); setEditing(null);}}
          onSave={(data)=> editing ? updateHabit(editing.id, data) : addHabit(data)} />
      )}

      {toast && (
        <div style={{position:"fixed", bottom:20, left:"50%", transform:"translateX(-50%)", background:C.surface2, border:`1px solid ${C.border}`, color:C.text, padding:"10px 16px", borderRadius:10, fontSize:13, boxShadow:"0 8px 24px rgba(0,0,0,0.3)"}} className="fade-in">
          {toast}
        </div>
      )}
    </div>
  );
}

function InsightsPanel({ insights, C, onSelect }){
  if (!insights.length) return null;
  const top = insights[0];
  return (
    <div style={{display:"flex", flexDirection:"column", gap:14}} className="fade-in">
      <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:20}}>
        <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:4}}>
          <Icon name="star" size={16} color="#F2A93B" />
          <span className="font-display" style={{fontSize:18}}>Most consistent</span>
        </div>
        <p style={{color:C.muted, fontSize:13, margin:0}}>
          <span style={{color:top.habit.color, fontWeight:600}}>{top.habit.name}</span> — {top.completion}% of the last 30 days at goal, longest streak {top.longest} day{top.longest===1?"":"s"}.
        </p>
      </div>

      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {insights.map(row => (
          <button key={row.habit.id} onClick={()=>onSelect(row.habit.id)} className="tap" style={{
            textAlign:"left", background:C.surface, border:`1px solid ${C.border}`, borderRadius:12, padding:16,
            display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap"
          }}>
            <div style={{display:"flex", alignItems:"center", gap:10}}>
              <span style={{width:10,height:10,borderRadius:"50%", background:row.habit.color}} />
              <span style={{fontSize:14, fontWeight:500}}>{row.habit.name}</span>
            </div>
            <div style={{display:"flex", gap:18}}>
              <div style={{textAlign:"right"}}>
                <div className="font-mono" style={{fontSize:14}}>{row.completion}%</div>
                <div style={{color:C.faint, fontSize:10, fontFamily:"JetBrains Mono, monospace"}}>30-DAY RATE</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="font-mono" style={{fontSize:14}}>{row.longest}</div>
                <div style={{color:C.faint, fontSize:10, fontFamily:"JetBrains Mono, monospace"}}>BEST STREAK</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div className="font-mono" style={{fontSize:14}}>{row.current}</div>
                <div style={{color:C.faint, fontSize:10, fontFamily:"JetBrains Mono, monospace"}}>CURRENT</div>
              </div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function CalendarView({ calMonth, setCalMonth, grid, habit, habitEntries, onSetValue, C }){
  const [editingDay, setEditingDay] = useState(null);
  const [dayVal, setDayVal] = useState("");

  function openDay(d){
    const key = dateKey(d);
    setEditingDay(key);
    setDayVal(String(habitEntries[key] ?? ""));
  }
  function commitDay(){
    if (!editingDay) return;
    const num = dayVal==="" ? null : Number(dayVal);
    onSetValue(editingDay, num);
    setEditingDay(null);
  }

  return (
    <div style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:20}} className="fade-in">
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14}}>
        <button onClick={()=>setCalMonth(new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1))} className="tap" style={{background:"none", border:"none", color:C.muted, padding:4}}><Icon name="chevron-left" size={16}/></button>
        <span className="font-display" style={{fontSize:17}}>{monthLabel(calMonth)}</span>
        <button onClick={()=>setCalMonth(new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1))} className="tap" style={{background:"none", border:"none", color:C.muted, padding:4}}><Icon name="chevron-right" size={16}/></button>
      </div>

      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6, marginBottom:6}}>
        {["S","M","T","W","T","F","S"].map((w,i)=>(
          <div key={i} style={{textAlign:"center", fontSize:10, color:C.faint, fontFamily:"JetBrains Mono, monospace"}}>{w}</div>
        ))}
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6}}>
        {grid.map((d,i)=>{
          if (!d) return <div key={i} />;
          const key = dateKey(d);
          const value = habitEntries[key];
          const met = goalMet(value, habit.goal);
          const isToday = sameDay(d, new Date());
          const isFuture = d > new Date(new Date().toDateString());
          return (
            <button key={i} disabled={isFuture} onClick={()=>openDay(d)} className={`tap ${met?"day-lit":""}`} style={{
              aspectRatio:"1", borderRadius:8, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              fontSize:12, background: met? `${habit.color}33` : C.surface2,
              border: isToday? `1.5px solid ${habit.color}` : `1px solid ${C.border}`,
              color: met? C.text : C.muted, opacity: isFuture? 0.35 : 1, cursor: isFuture? "default":"pointer",
              "--glow-color": `${habit.color}99`,
            }}>
              <span className="font-mono">{d.getDate()}</span>
              {value!=null && !met && <span style={{fontSize:8, color:C.faint}} className="font-mono">{value}</span>}
            </button>
          );
        })}
      </div>

      {editingDay && (
        <div style={{marginTop:16, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
          <span style={{color:C.muted, fontSize:11}} className="font-mono">{editingDay}</span>
          <input type="number" autoFocus value={dayVal} onChange={e=>setDayVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&commitDay()}
            style={{background:C.surface2, border:`1px solid ${C.border}`, color:C.text, width:80, textAlign:"center", borderRadius:8, padding:"4px 8px", fontSize:13}} className="font-mono"/>
          <button onClick={commitDay} className="tap" style={{background:habit.color, border:"none", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:600, color:"#14171C"}}>Save</button>
          <button onClick={()=>setEditingDay(null)} style={{background:"none", border:"none", color:C.muted, fontSize:12}}>Cancel</button>
        </div>
      )}
      <p style={{color:C.faint, fontSize:11, marginTop:12, marginBottom:0}}>Days that glow reached the goal. Click any past day to log or edit it.</p>
    </div>
  );
}

function HabitModal({ initial, onClose, onSave, C }){
  const [name, setName] = useState(initial?.name || "");
  const [color, setColor] = useState(initial?.color || CATEGORY_COLORS[0].hex);
  const [unit, setUnit] = useState(initial?.unit || "");
  const [goal, setGoal] = useState(initial?.goal!=null ? String(initial.goal) : "1");

  function submit(){
    if (!name.trim()) return;
    onSave({ name:name.trim(), color, unit:unit.trim(), goal:Number(goal)||0 });
  }

  return (
    <div onClick={onClose} style={{position:"fixed", inset:0, zIndex:50, display:"flex", alignItems:"center", justifyContent:"center", padding:16, background:"rgba(0,0,0,0.6)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, padding:24, width:"100%", maxWidth:380}} className="fade-in">
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20}}>
          <h3 className="font-display" style={{fontSize:20, margin:0}}>{initial? "Edit habit":"New habit"}</h3>
          <button onClick={onClose} style={{background:"none", border:"none", color:C.muted}}><Icon name="x" size={18}/></button>
        </div>
        <div style={{display:"flex", flexDirection:"column", gap:16}}>
          <div>
            <label style={{color:C.muted, fontSize:11, fontFamily:"JetBrains Mono, monospace", display:"block", marginBottom:6}}>NAME</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Drink water"
              style={{width:"100%", background:C.surface2, border:`1px solid ${C.border}`, color:C.text, borderRadius:8, padding:"8px 12px", fontSize:14}} />
          </div>
          <div>
            <label style={{color:C.muted, fontSize:11, fontFamily:"JetBrains Mono, monospace", display:"block", marginBottom:6}}>COLOR</label>
            <div style={{display:"flex", flexWrap:"wrap", gap:8}}>
              {CATEGORY_COLORS.map(c=>(
                <button key={c.hex} onClick={()=>setColor(c.hex)} title={c.name} className="tap" style={{
                  width:28, height:28, borderRadius:"50%", background:c.hex, border:"none",
                  outline: color===c.hex ? "2px solid white" : "none", outlineOffset:2,
                }} />
              ))}
            </div>
          </div>
          <div style={{display:"flex", gap:12}}>
            <div style={{flex:1}}>
              <label style={{color:C.muted, fontSize:11, fontFamily:"JetBrains Mono, monospace", display:"block", marginBottom:6}}>DAILY GOAL</label>
              <input type="number" value={goal} onChange={e=>setGoal(e.target.value)}
                style={{width:"100%", background:C.surface2, border:`1px solid ${C.border}`, color:C.text, borderRadius:8, padding:"8px 12px", fontSize:14}} className="font-mono" />
            </div>
            <div style={{flex:1}}>
              <label style={{color:C.muted, fontSize:11, fontFamily:"JetBrains Mono, monospace", display:"block", marginBottom:6}}>UNIT (optional)</label>
              <input value={unit} onChange={e=>setUnit(e.target.value)} placeholder="glasses, min…"
                style={{width:"100%", background:C.surface2, border:`1px solid ${C.border}`, color:C.text, borderRadius:8, padding:"8px 12px", fontSize:14}} />
            </div>
          </div>
          <button onClick={submit} className="tap" style={{marginTop:6, width:"100%", padding:"11px", borderRadius:10, border:"none", background:color, color:"#14171C", fontSize:14, fontWeight:700}}>
            {initial? "Save changes":"Create habit"}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
